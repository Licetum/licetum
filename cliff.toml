# git-cliff configuration for Licetum.
# https://git-cliff.org/docs/configuration

[remote.github]
owner = "Licetum"
repo = "licetum"

[changelog]
header = """
# Changelog

All notable changes to Licetum are documented here.
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Licetum/licetum/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs?", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Testing" },
  { message = "^style", group = "Styling" },
  { message = "^chore", group = "Chores" },
  { message = "^ci", group = "CI" },
  { message = "^revert", group = "Reverted" },
  { message = ".*", group = "Other" },
]

[bump]
initial_tag = "0.0.0"
features_always_bump_minor = true
breaking_always_bump_major = true
no_increment_regex = "^(chore|ci|docs?)(\\(.+\\))?:"
