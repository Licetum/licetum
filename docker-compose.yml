# Development stack: sources are mounted into the containers, the Go apps are rebuilt by air and the
# web interface runs the Next.js dev server — edits are picked up without rebuilding images.
# For production, build the `runtime` target of core/Dockerfile (the PDP) or admin-api/Dockerfile (the admin API) (a single static binary).
include:
  - infra/postgres.compose.yml
  - infra/dex.compose.yml

x-env-app: &env-app
  DB__URI: "${DB__URI:-postgresql://authz:authz@postgres:5432/authz_db}"
  # air restarts the apps on every change: no drain on shutdown in development (the default of 10 s is for a balancer).
  SHUTDOWN__DRAIN: "${SHUTDOWN__DRAIN:-0}"
  # The address clients reach the PDP at: the AuthZEN discovery document is built from it.
  PDP__PUBLIC_URL: "${PDP__PUBLIC_URL:-http://localhost:8001}"
  # Administrators sign in at an OpenID Connect provider (ADMIN_AUTH__*, the local Dex by default): the admin API verifies their
  # bearer tokens against its keys, and the web interface is the OIDC client (OIDC_* of the web service below). The audience is the
  # client id of the web interface, which Dex puts into the aud of its tokens. Override the variables in .env to use another IdP.
  ADMIN_AUTH__ISSUER: "${ADMIN_AUTH__ISSUER:-http://localhost:5556/dex}"
  ADMIN_AUTH__AUDIENCE: "${ADMIN_AUTH__AUDIENCE:-licetum-local}"
  # The keys are read from the Compose network name: the APIs call them from their containers.
  ADMIN_AUTH__JWKS_URL: "${ADMIN_AUTH__JWKS_URL:-http://dex:5556/dex/keys}"
  # Self-service: Licetum registers itself as a Service, and the admin API is protected by its
  # policies (see core/db/migrate.go, SeedPlatform).
  PLATFORM__NAME: "${PLATFORM__NAME:-Licetum}"
  PLATFORM__URL: "${PLATFORM__URL:-http://localhost:8002}"
  PLATFORM__ICON: "${PLATFORM__ICON:-http://localhost:8002/favicon.ico}"
  # Platform administrators: the role is seeded together with the self-service; everyone whose
  # ADMIN_CLAIM claim takes one of ADMIN_CLAIM_VALUES (a JSON list or CSV) becomes a member. Without
  # values the role stays empty — nobody can manage Licetum, the admin API is closed by the policies.
  PLATFORM__ADMIN_GROUP_NAME: "${PLATFORM__ADMIN_GROUP_NAME:-Platform administrator}"
  PLATFORM__ADMIN_CLAIM: "${PLATFORM__ADMIN_CLAIM:-preferred_username}"
  PLATFORM__ADMIN_CLAIM_VALUES: "${PLATFORM__ADMIN_CLAIM_VALUES:-[\"admin\"]}"

x-conf-go: &conf-go
  environment:
    <<: *env-app
  volumes:
    - go-build-cache:/root/.cache/go-build
  depends_on:
    postgres:
      condition: service_healthy

# The Go modules: core (MIT: the PDP runtime) and admin-api (AGPL: the admin API, which depends on core). Both are
# mounted, so the admin image sees the core sources it is built against (see the replace in admin-api/go.mod).
x-core: &core
  build:
    context: .
    dockerfile: core/Dockerfile
    target: dev
  volumes:
    - ./core/:/src/core/:rw,z
    - go-build-cache:/root/.cache/go-build

x-admin: &admin
  build:
    context: .
    dockerfile: admin-api/Dockerfile
    target: dev
  volumes:
    - ./core/:/src/core/:rw,z
    - ./admin-api/:/src/admin-api/:rw,z
    - go-build-cache:/root/.cache/go-build

services:
  postgres_init:
    <<: [*conf-go, *core]
    container_name: licetum_migration
    working_dir: /src/core
    command: ["go", "run", "./cmd/licetum", "migrate"]
  pdp:
    <<: [*conf-go, *core]
    container_name: licetum_pdp
    working_dir: /src/core
    # air rebuilds and restarts the app on every change under ./core.
    command:
      - air
      - --tmp_dir=/tmp/air
      - --build.cmd=go build -o /tmp/air/licetum ./cmd/licetum
      - --build.entrypoint=/tmp/air/licetum
      - --build.args_bin=pdp,-addr,:8001
      - --build.exclude_dir=schema,tmp
    # The probes and /metrics are on the ops port: inside the network only (expose, not ports).
    environment:
      <<: *env-app
      PDP__OPS_ADDR: ":9090"
    expose:
      - "9090"
    ports:
      - "8001:8001"
    depends_on:
      postgres_init:
        condition: service_completed_successfully
  worker:
    <<: [*conf-go, *core]
    container_name: licetum_worker
    working_dir: /src/core
    # The synchronization worker: the PDP and the admin API queue the jobs that fetch the resource sources, this one runs
    # them (metrics on :8002 inside the network).
    command:
      - air
      - --tmp_dir=/tmp/air
      - --build.cmd=go build -o /tmp/air/licetum ./cmd/licetum
      - --build.entrypoint=/tmp/air/licetum
      - --build.args_bin=worker
      - --build.exclude_dir=schema,tmp
    depends_on:
      postgres_init:
        condition: service_completed_successfully
  admin:
    <<: [*conf-go, *admin]
    container_name: licetum_admin
    working_dir: /src/admin-api
    # air rebuilds and restarts the app on every change under ./admin-api and ./core.
    command:
      - air
      - --tmp_dir=/tmp/air
      - --build.cmd=go build -o /tmp/air/licetum-admin ./cmd/licetum-admin
      - --build.entrypoint=/tmp/air/licetum-admin
      - --build.args_bin=admin,-addr,:8000
      - --build.exclude_dir=schema,tmp
    ports:
      - "8002:8000"
    depends_on:
      postgres_init:
        condition: service_completed_successfully
  web:
    container_name: licetum_web
    environment:
      # The server of the UI calls the APIs over the Compose network.
      ADMIN_API_URL: "http://admin:8000"
      CHECK_API_URL: "http://pdp:8001"
      CHECK_API_PUBLIC_URL: "${CHECK_API_PUBLIC_URL:-http://localhost:8001}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:3000}"
      # The web interface is the OpenID Connect client of the administrator sign-in. The authorization endpoint is where the
      # browser is sent; the token endpoint is called by this server over the Compose network. The redirect URI registered
      # at Dex is ${APP_BASE_URL}/auth/callback (infra/dex/config.yaml).
      OIDC_AUTHORIZATION_URL: "${OIDC_AUTHORIZATION_URL:-http://localhost:5556/dex/auth}"
      OIDC_TOKEN_URL: "${OIDC_TOKEN_URL:-http://dex:5556/dex/token}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-licetum-local}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-licetum-local-secret}"
      SESSION_SECRET: "${SESSION_SECRET:-dev-only-insecure-session-secret-change-me-0123456789}"
    volumes:
      - ./web/:/app/:rw,z
      - /app/node_modules
      - /app/.next
      # orval input; the mount above hides the client generated in the image, so regenerate it
      # on start (src/api is not committed).
      - ./admin-api/schema/:/admin-api/schema/:ro,z
    build:
      context: .
      dockerfile: web/Dockerfile
      target: build-deps
    command: ["sh", "-c", "pnpm orval && pnpm dev --hostname 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    depends_on:
      - admin
      - pdp
      - dex

volumes:
  go-build-cache:
