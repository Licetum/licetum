services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-authz}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-authz}"
      POSTGRES_DB: "${POSTGRES_DB:-authz_db}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-authz} -d ${POSTGRES_DB:-authz_db}
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
