# Development-only Dex configuration.
# The passwords and client secret below are intentionally public and must not be reused outside
# the local Compose stack. Override PLATFORM__* and replace this IdP for production deployments.

issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: licetum-local
    name: Licetum local development
    secret: licetum-local-secret
    redirectURIs:
      - http://localhost:8002/service/275d0b64-c908-5af4-a046-41dd0c3ac1aa/oauth/callback
      - http://127.0.0.1:8002/service/275d0b64-c908-5af4-a046-41dd0c3ac1aa/oauth/callback

enablePasswordDB: true
staticPasswords:
  - email: admin@example.com
    # bcrypt hash of "password" (development-only credential)
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: admin
    name: Local Admin
    preferredUsername: admin
    emailVerified: true
    groups:
      - licetum-admins
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
