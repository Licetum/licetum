{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "licetum.secretName" . }}
  labels:
    {{- include "licetum.labels" . | nindent 4 }}
  annotations:
    # Hooks, so that they exist when the migration Job of a pre-install / pre-upgrade runs (a hook runs before the rest of the release
    # is created). They are kept after the hook and replaced at every install and upgrade; `helm uninstall` does not remove them.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DB__URI: {{ required "secrets.dbUri (or existingSecret) is required" .Values.secrets.dbUri | quote }}
  {{- with .Values.secrets.dbMigrateUri }}
  DB__MIGRATE_URI: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.sessionSecret }}
  SESSION_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
