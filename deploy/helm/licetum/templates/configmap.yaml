apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "licetum.fullname" . }}-config
  labels:
    {{- include "licetum.labels" . | nindent 4 }}
  annotations:
    # Hooks, so that they exist when the migration Job of a pre-install / pre-upgrade runs (a hook runs before the rest of the release
    # is created). They are kept after the hook and replaced at every install and upgrade; `helm uninstall` does not remove them.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  DB__PGBOUNCER: {{ .Values.db.pgbouncer | quote }}
  DB__POOL_SIZE: {{ .Values.db.poolSize | quote }}
  DB__MAX_OVERFLOW: {{ .Values.db.maxOverflow | quote }}
  DB__SYNC_POOL_SIZE: {{ .Values.db.syncPoolSize | quote }}
  DB__MAX_REPLICA_LAG: {{ .Values.db.maxReplicaLag | quote }}
  DB__LAG_ACTION: {{ .Values.db.lagAction | quote }}
  SHUTDOWN__DRAIN: {{ printf "%ds" (int .Values.shutdown.drain) | quote }}
  SHUTDOWN__TIMEOUT: {{ printf "%ds" (int .Values.shutdown.timeout) | quote }}
  SYNC__ENGINE: {{ .Values.worker.engine | quote }}
  {{- with .Values.policyMaxStaleness }}
  POLICY__MAX_STALENESS: {{ . | quote }}
  {{- end }}
  {{- with .Values.publicUrl }}
  HTTP__PUBLIC_URL: {{ . | quote }}
  {{- end }}
  PLATFORM__NAME: {{ .Values.platform.name | quote }}
  PLATFORM__URL: {{ .Values.platform.url | quote }}
  PLATFORM__ICON: {{ .Values.platform.icon | quote }}
  PLATFORM__AUTHORIZATION_URL: {{ .Values.platform.authorizationUrl | quote }}
  PLATFORM__TOKEN_URL: {{ .Values.platform.tokenUrl | quote }}
  PLATFORM__JWKS_URL: {{ .Values.platform.jwksUrl | quote }}
  PLATFORM__ISSUER: {{ .Values.platform.issuer | quote }}
  PLATFORM__CLIENT_ID: {{ .Values.platform.clientId | quote }}
  PLATFORM__ADMIN_GROUP_NAME: {{ .Values.platform.adminGroupName | quote }}
  PLATFORM__ADMIN_CLAIM: {{ .Values.platform.adminClaim | quote }}
  PLATFORM__ADMIN_CLAIM_VALUES: {{ .Values.platform.adminClaimValues | quote }}
  {{- range $name, $value := .Values.env }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
