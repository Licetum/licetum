{{- if .Values.admin.enabled }}
{{- $component := dict "root" . "component" "admin" }}
{{- $_ := required "adminAuth.issuer, adminAuth.audience and adminAuth.jwksUrl are required for the admin API: administrators sign in at that identity provider" (and .Values.adminAuth.issuer .Values.adminAuth.audience .Values.adminAuth.jwksUrl) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "licetum.fullname" . }}-admin
  labels:
    {{- include "licetum.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "licetum.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "licetum.labels" . | nindent 8 }}
        app.kubernetes.io/component: admin
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.admin.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "licetum.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ include "licetum.terminationGrace" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "licetum.placement" $component | nindent 6 }}
      {{- with .Values.admin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin
          image: {{ include "licetum.imageAdmin" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["admin", "-addr", ":{{ .Values.admin.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.admin.port }}
          envFrom:
            - configMapRef:
                name: {{ include "licetum.fullname" . }}-config
          env:
            {{- include "licetum.secretEnv" (dict "root" . "key" "DB__URI") | nindent 12 }}
            {{- include "licetum.secretEnv" (dict "root" . "key" "REDIS__URI") | nindent 12 }}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: {{ int .Values.shutdown.drain }}
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "licetum.fullname" . }}-admin
  labels:
    {{- include "licetum.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
  {{- with .Values.admin.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.admin.service.type }}
  selector:
    {{- include "licetum.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.admin.port }}
      targetPort: http
{{- end }}
