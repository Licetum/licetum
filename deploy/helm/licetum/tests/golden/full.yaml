      # No service account of the release: the Job runs before the rest of the release exists (it is a pre-install hook), and needs
      # no access to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "ghcr.io/licetum/licetum:0.1.0"
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: release-licetum-config
          env:
            - name: DB__URI
              valueFrom:
                secretKeyRef:
                  name: licetum-secrets
                  key: DB__URI
            - name: DB__MIGRATE_URI
              valueFrom:
                secretKeyRef:
                  name: licetum-secrets
                  key: DB__MIGRATE_URI
                  optional: true
            - name: REDIS__URI
              valueFrom:
                secretKeyRef:
                  name: licetum-secrets
                  key: REDIS__URI
            - name: AUTH__STATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: licetum-secrets
                  key: AUTH__STATE_SECRET
            - name: PLATFORM__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: licetum-secrets
                  key: PLATFORM__CLIENT_SECRET
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
