apiVersion: batch/v1
kind: Job
metadata:
  name: release-licetum-migrate
  labels:
    helm.sh/chart: licetum-0.1.0
    app.kubernetes.io/name: licetum
    app.kubernetes.io/instance: release
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    licetum.io/region: "eu"
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        helm.sh/chart: licetum-0.1.0
        app.kubernetes.io/name: licetum
        app.kubernetes.io/instance: release
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        licetum.io/region: "eu"
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # No service account of the release: the Job runs before the rest of the release exists (it is a pre-install hook), and needs
      # no access to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "ghcr.io/licetum/licetum:0.1.0"
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: release-licetum-config
          env:
            - name: DB__URI
              valueFrom:
                secretKeyRef:
                  name: release-licetum-secrets
                  key: DB__URI
            - name: DB__MIGRATE_URI
              valueFrom:
                secretKeyRef:
                  name: release-licetum-secrets
                  key: DB__MIGRATE_URI
                  optional: true
            - name: REDIS__URI
              valueFrom:
                secretKeyRef:
                  name: release-licetum-secrets
                  key: REDIS__URI
            - name: AUTH__STATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: release-licetum-secrets
                  key: AUTH__STATE_SECRET
            - name: PLATFORM__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: release-licetum-secrets
                  key: PLATFORM__CLIENT_SECRET
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
