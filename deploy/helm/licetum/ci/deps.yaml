# PostgreSQL for the installation into kind (deploy/helm/kind-test.sh), in the namespace of the release.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "max_connections=200"]
          env:
            - {name: POSTGRES_USER, value: licetum}
            - {name: POSTGRES_PASSWORD, value: licetum}
            - {name: POSTGRES_DB, value: licetum}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: {command: [pg_isready, -U, licetum]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
