# The values of the installation into kind: the images built by the test, the PostgreSQL and Redis of deps.yaml.
region: kind
# The PDP identifier is an https name (the PEPs use it); the smoke test fetches the discovery document over http in the cluster.
publicUrl: https://licetum.example.com
image:
  core: {repository: licetum, tag: ci}
  admin: {repository: licetum-admin, tag: ci}
  pullPolicy: Never
secrets:
  dbUri: postgres://licetum:licetum@postgres:5432/licetum?sslmode=disable
  redisUri: redis://redis:6379/0
  authStateSecret: kind-only-state-secret
platform:
  url: http://admin.invalid
  icon: http://admin.invalid/favicon.ico
adminAuth:
  issuer: http://idp.invalid
  audience: licetum-admin
  jwksUrl: http://idp.invalid/keys
shutdown:
  drain: 5
  timeout: 15
pdp:
  replicas: 3
  opsPort: 9090
  autoscaling:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 64Mi}
admin:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
worker:
  engine: postgres
  resources:
    requests: {cpu: 50m, memory: 64Mi}
topologySpreadConstraints:
  enabled: false
podAntiAffinity:
  enabled: false
