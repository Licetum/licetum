# The values of the installation into kind: the images built by the test, the PostgreSQL and Redis of deps.yaml.
region: kind
publicUrl: http://licetum-check:8001
image:
  core: {repository: licetum, tag: ci}
  admin: {repository: licetum-admin, tag: ci}
  pullPolicy: Never
secrets:
  dbUri: postgres://licetum:licetum@postgres:5432/licetum?sslmode=disable
  redisUri: redis://redis:6379/0
  authStateSecret: kind-only-state-secret
  platformClientSecret: kind-only-client-secret
platform:
  url: http://admin.invalid
  icon: http://admin.invalid/favicon.ico
  authorizationUrl: http://idp.invalid/auth
  tokenUrl: http://idp.invalid/token
  jwksUrl: http://idp.invalid/keys
  issuer: http://idp.invalid
  clientId: licetum
shutdown:
  drain: 5
  timeout: 15
check:
  replicas: 3
  autoscaling:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 64Mi}
admin:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
worker:
  engine: postgres
  resources:
    requests: {cpu: 50m, memory: 64Mi}
topologySpreadConstraints:
  enabled: false
podAntiAffinity:
  enabled: false
