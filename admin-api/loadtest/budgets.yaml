# Budgets of the check API load test (admin-api/loadtest), see notebook/README.md.
#
# One entry per profile, mode and latency added to PostgreSQL and Redis. A nightly run is compared with its entry by
# `licetum-loadtest budget`; a figure more than `tolerance` on the wrong side fails the workflow (a latency also gets
# `latency_slack_ms` on top: a few milliseconds are jitter on a shared runner):
#   rps                 the sustained rate (the highest ramp step that met its objectives): a floor
#   reference_rps       the step the other figures belong to (the sustained step of the baseline)
#   p50_ms, p99_ms      latency of all the requests of that step: ceilings (p99 0: the step had too few samples)
#   db_queries_per_request, redis_round_trips_per_request   counted by the server: ceilings
# The figures come from the baseline of block F0 and are set again, on purpose, when a block improves them
# (`licetum-loadtest budget -calibrate`). A run that is better than its budget by more than the tolerance does not
# fail; its report asks for the budget to be set again.
tolerance: 0.15
latency_slack_ms: 5
budgets:
    - profile: medium
      mode: cold
      added_latency_ms: 0
      rps: 16
      reference_rps: 16
      p50_ms: 396.83
      p99_ms: 0
      db_queries_per_request: 15.42
      redis_round_trips_per_request: 5.65
      note: 'lowest sustained rate of two baseline runs on ubuntu-latest (4 vCPU), highest costs at that rate: commits b7859306 and 5abcc757, see loadtest/notebook/results'
    - profile: medium
      mode: cold
      added_latency_ms: 100
      rps: 8
      reference_rps: 8
      p50_ms: 2268.97
      p99_ms: 0
      db_queries_per_request: 15.23
      redis_round_trips_per_request: 5.19
      note: 'lowest sustained rate of two baseline runs on ubuntu-latest (4 vCPU), highest costs at that rate: commits b7859306 and 5abcc757, see loadtest/notebook/results'
    - profile: medium
      mode: mix
      added_latency_ms: 0
      rps: 20
      reference_rps: 20
      p50_ms: 52.87
      p99_ms: 0
      db_queries_per_request: 13.42
      redis_round_trips_per_request: 5.78
      note: 'lowest sustained rate of two baseline runs on ubuntu-latest (4 vCPU), highest costs at that rate: commits b7859306 and 5abcc757, see loadtest/notebook/results'
    - profile: medium
      mode: mix
      added_latency_ms: 100
      rps: 10
      reference_rps: 10
      p50_ms: 1575.25
      p99_ms: 0
      db_queries_per_request: 9.96
      redis_round_trips_per_request: 5.24
      note: 'lowest sustained rate of two baseline runs on ubuntu-latest (4 vCPU), highest costs at that rate: commits b7859306 and 5abcc757, see loadtest/notebook/results'
    - profile: medium
      mode: warm
      added_latency_ms: 0
      rps: 80
      reference_rps: 80
      p50_ms: 4.45
      p99_ms: 0
      db_queries_per_request: 6.05
      redis_round_trips_per_request: 3.86
      note: 'lowest sustained rate of two baseline runs on ubuntu-latest (4 vCPU), highest costs at that rate: commits b7859306 and 5abcc757, see loadtest/notebook/results'
    - profile: medium
      mode: warm
      added_latency_ms: 100
