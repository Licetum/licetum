        created_at:
          description: When the key was issued
          format: date-time
          type: string
        expires_at:
          description: "When the key stops working; null: never"
          format: date-time
          type:
            - string
            - "null"
        key_id:
          description: Identifies the key (it is the part of the key after lct_); the key itself is never stored
          examples:
            - 3f9a1c0d5b7e2a64
          type: string
        revoked_at:
          description: "When the key was revoked; null: it is not"
          format: date-time
          type:
            - string
            - "null"
      required:
        - key_id
        - created_at
        - expires_at
        - revoked_at
        - active
      type: object
    PEPKeyIssued:
      additionalProperties: false
      properties:
        active:
          description: "Whether the key works now: not revoked and not expired. A client has at most two active keys"
          type: boolean
        created_at:
          description: When the key was issued
          format: date-time
          type: string
        expires_at:
          description: "When the key stops working; null: never"
          format: date-time
          type:
            - string
            - "null"
        key:
          description: The API key (lct_<key id>_<secret>). It is shown once and cannot be read again; send it as the bearer token of the AuthZEN API
          type: string
        key_id:
          description: Identifies the key (it is the part of the key after lct_); the key itself is never stored
          examples:
            - 3f9a1c0d5b7e2a64
          type: string
        revoked_at:
          description: "When the key was revoked; null: it is not"
