        id:
          description: Client id
          format: uuid
          type: string
        issuer:
          description: "jwt only: the issuer of the client's tokens"
          type:
            - string
            - "null"
        kind:
          description: jwt or api_key
          enum:
            - jwt
            - api_key
          type: string
        name:
          description: Name of the client, unique within the service
          type: string
        operations:
          description: What the client may call
          items:
            type: string
          type: array
        service_id:
          description: The service the client belongs to
          format: uuid
          type: string
      required:
        - id
        - service_id
        - name
        - kind
        - issuer
        - client_id
        - operations
        - enabled
        - created_at
      type: object
    PEPClientInput:
      additionalProperties: true
      properties:
        client_id:
          description: "jwt only: the client of the issuer (the azp, or client_id, of its tokens)"
          examples:
            - checkout-backend
          type: string
        enabled:
          description: "Whether the client is accepted; absent: true"
          type: boolean
        issuer:
          description: "jwt only: the registered issuer (its iss) the tokens of the client come from"
          examples:
            - https://idp.example.com/realms/main
          type: string
        kind:
          description: "jwt: a client application of a registered issuer, which presents its access tokens; api_key: the client holds API keys that Licetum issues"
          enum:
            - jwt
            - api_key
          type: string
        name:
          description: Name of the client, unique within the service
          examples:
            - checkout
          maxLength: 100
          minLength: 1
          type: string
        operations:
          description: "What the client may call. Absent: evaluate only; explain and the three searches are off by default"
          items:
            enum:
              - evaluate
              - search_resource
              - search_action
              - search_subject
              - explain
            type: string
          type:
            - array
            - "null"
      required:
        - name
        - kind
      type: object
    PEPClientPatch:
      additionalProperties: true
      properties:
        client_id:
          description: "jwt only: the client of the issuer"
          type: string
        enabled:
          description: Whether the client is accepted. A disabled client's API keys are refused (401) and its tokens get the same 403 as an unregistered client
          type: boolean
        issuer:
          description: "jwt only: the registered issuer the tokens of the client come from"
          type: string
        name:
          description: New name of the client
          maxLength: 100
          minLength: 1
          type: string
        operations:
          description: What the client may call; replaces the list
          items:
            enum:
              - evaluate
              - search_resource
              - search_action
              - search_subject
              - explain
            type: string
          type: array
      type: object
    PEPIssuer:
      additionalProperties: true
      properties:
        algs:
          description: "The signature algorithms accepted. Absent: RS256, ES256 and EdDSA. Asymmetric algorithms only"
          items:
            enum:
              - RS256
              - RS384
              - RS512
              - PS256
              - PS384
              - PS512
              - ES256
              - ES384
              - ES512
              - EdDSA
            type: string
          type:
            - array
            - "null"
        audiences:
          description: "The values one of which the aud of a token must contain. Absent or empty: the audience of the PDP (PDP__AUDIENCE, else PDP__PUBLIC_URL). A token always needs an aud"
          items:
            type: string
          type:
            - array
            - "null"
        issuer:
          description: The iss of the tokens, compared exactly
          examples:
            - https://idp.example.com/realms/main
          maxLength: 2048
          minLength: 1
          type: string
        jwks_url:
          description: Where the keys of the issuer are read
          examples:
            - https://idp.example.com/realms/main/protocol/openid-connect/certs
          type: string
        require_typ:
          description: Accept only tokens whose typ header is at+jwt (RFC 9068)
          type: boolean
      required:
        - issuer
        - jwks_url
      type: object
    PEPKey:
      additionalProperties: false
      properties:
