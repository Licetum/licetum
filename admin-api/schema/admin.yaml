          description: "The attributes to write, each under its name. Empty: every attribute, under its own name"
          items:
            $ref: "#/components/schemas/LogField"
          type: array
        format:
          description: "json: one JSON object per line; logfmt: key=value pairs; text: plain lines"
          enum:
