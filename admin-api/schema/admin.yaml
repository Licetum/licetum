          examples:
            - alice
          minLength: 1
          type: string
      required:
        - name
        - subject
        - checks
      type: object
    PolicyTestCaseResult:
      additionalProperties: false
      properties:
        checks:
          description: The answers of the scenario, one per expectation
          items:
            $ref: "#/components/schemas/PolicyTestCheckResult"
          type: array
        name:
          description: The name of the scenario
          type: string
        passed:
          description: Whether every expectation of the scenario holds
          type: boolean
      required:
        - name
        - passed
        - checks
      type: object
    PolicyTestCheck:
      additionalProperties: false
      properties:
        action:
          description: The access level asked for
          examples:
            - read
          type: string
        expect:
          description: allow — the answer must be allowed; deny — it must not be
          enum:
            - allow
            - deny
          type: string
        resource_id:
          description: The resource; omit it to ask about the type as a whole
          type: string
        type:
          description: Name of the resource type in the service
          examples:
            - branch
          type: string
      required:
        - type
        - action
        - expect
      type: object
    PolicyTestCheckResult:
      additionalProperties: false
      properties:
        decision:
          description: What the rules answered
          enum:
            - allowed
            - denied
            - no_access
            - resource_not_found
            - type_not_found
          type: string
        expect:
          description: What was expected
          enum:
            - allow
            - deny
          type: string
        index:
          description: Position of the check in its scenario
          format: int64
          type: integer
        passed:
          description: Whether the answer is the expected one
          type: boolean
        rules:
          description: "The rules that decided the answer: the ones that granted the level and the denials"
          items:
            type: string
          type: array
      required:
        - index
        - expect
        - decision
        - passed
        - rules
      type: object
    PolicyTestInput:
      additionalProperties: true
