    GroupMemberInput:
      additionalProperties: true
      properties:
        enabled:
          default: true
          description: Whether the rule is active
          type:
            - boolean
            - "null"
        expires_at:
          description: The membership ends at this moment (RFC 3339); omitted or null — never
          format: date-time
          type:
            - string
            - "null"
        member_group_id:
          description: "Nest another group as a whole: its members become members of this group (mutually exclusive with predicate)"
          format: uuid
          type: string
        predicate:
          description: AND conditions over subject claims; an empty list matches any subject
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type:
            - array
            - "null"
        valid_from:
          description: The membership starts at this moment (RFC 3339); omitted or null — right away
          format: date-time
          type:
            - string
            - "null"
      type: object
    HealthOutputBody:
      additionalProperties: false
