info:
  description: |
    **Licetum** is a centralized authorization service for all of your company's services.
    Access rights are stored in one place: instead of a separate role model in every application,
    rules are defined and checked centrally.

    ### Why

    - **Single point of control.** User permissions for every system are granted, revoked and checked in one place.
    - **Cross-service access.** Any entity of any service (a project, report, gallery, branch, etc.) can be
    shared, and the same users and groups can be granted access to it across all systems.
    - **Simpler maintenance.** Services don't implement authorization themselves; they ask Licetum:
    "may user X perform action Y on object Z?"
    - **Transparency and audit.** You can see who has which permissions and where they come from.

    ### Errors

    Every error is `{"detail": "text", "extra": {"type": "generic" | "missing" | "blocked_by", "code": "..."}}`.
    `detail` is localized according to the `Accept-Language` header (en, ru, zh); `extra.code` is a stable
    machine-readable code.
  license:
    identifier: MIT
    name: MIT
  title: Licetum — admin
  version: 0.1.0
openapi: 3.1.0
paths:
  /assignment_rule:
    get:
      description: "Rules of every service and type, with service and type names, sorted by them. target_valid=false marks a rule on a specific resource of a type that has no synchronizer (e.g. after it was deleted), or a rule that looks a resource up in, or climbs through, such a type: such a rule does not take effect (a denial of that kind still applies below the links to the resources the type left)."
      operationId: list_assignment_rules
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AssignmentRuleWithContext"
                type:
                  - array
                  - "null"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "424":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Failed Dependency
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - bearer: []
      summary: All access rules
      tags:
        - AssignmentRule
    post:
      description: |-
        What it grants — either **role_id** (all permissions of a role; each item of the role keeps its own
        target and access levels) or an inline permission: **type_resource_id** with **access** (for example ["read","write"]),
        on a specific resource (**resource_id**), on a resource computed from a claim at check time (**resource_from_claim**)
        or on the whole type (neither). The grant cascades to all resources of child types, including types of other
        services. A specific resource can only be targeted on a type with a synchronizer (400 otherwise): a type without one
        has no resources, and a rule on it grants access to the type as a whole (a not_sync type).

        Who the rule applies to — exactly one of: **subject** (a specific user or a group written as group:{uuid}),
        **predicate** (AND conditions over the claims of the subject) or **member_of_group_id** (all members of a group). If none is set,
        the rule applies to everyone.

        **effect** allow (the default) grants the access levels; deny takes them away from everything the rule covers, unless an
        exception below it lifts the denial. A role assignment takes the effect of the rule for all of its items.
      operationId: create_assignment_rule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentRuleInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentRule"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "424":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Failed Dependency
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - bearer: []
      summary: Create an access rule
      tags:
        - AssignmentRule
  /assignment_rule/preview:
