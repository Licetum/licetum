            type: string
          type:
            - array
            - "null"
        description:
          description: What the rule is for
          type: string
        effect:
          description: allow or deny; absent — allow
          enum:
            - allow
            - deny
          type: string
        enabled:
          description: Whether the rule is active; absent — active
          type: boolean
        exception:
          description: An allow rule that lifts the denials above it
          type: boolean
        expires_at:
          description: The rule stops taking effect at this moment
          format: date-time
          type: string
        member_of:
          description: The name of the group whose members the rule covers
          type: string
        name:
          description: "The name: unique in the document. A rule without one has the name rule-<id>"
          maxLength: 200
          minLength: 1
          type: string
        on_missing_attribute:
          description: What a denial does when an attribute is missing
          enum:
            - skip
            - apply
          type: string
        predicate:
          description: AND conditions over the claims and the request
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type:
            - array
            - "null"
        requires_group:
          description: The name of a group the subject must belong to
          type: string
        requires_predicate:
          description: Guard conditions
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type:
            - array
            - "null"
        resource_from_claim:
          $ref: "#/components/schemas/PolicyResourceFromClaim"
          description: A resource computed from a claim of the subject
        resource_id:
          description: A resource of the type
          type: string
        resource_where:
          description: The resources whose attributes match
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type:
            - array
            - "null"
        role:
          description: The name of the role granted; absent for an inline rule
          type: string
        subject:
          description: A specific subject, or group:<id>
          type: string
        subject_kind:
          description: A label of the subject
          enum:
            - user
            - service
            - agent
            - group
          type: string
        type:
          description: The resource type of the inline permission, as service/type; absent for a role rule
          type: string
        valid_from:
          description: The rule takes effect from this moment
          format: date-time
          type: string
