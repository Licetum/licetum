tags:
  - description: Client applications registered in Licetum. The slug of a service names it in the paths of the PDP.
    name: Service
  - description: Resource types of a service. The parent (type_resource_parent_id) may belong to another service and defines the permission inheritance chain.
    name: Type resource
  - description: Concrete resources of a type and the synchronizers that fetch them from the owning service (SQL query or HTTP).
    name: Resource
  - description: "Global groups of people: a group is a subject too (`group:<uuid>`), so it is granted permissions the same way as a user."
    name: Group
  - description: "Who belongs to a group: by a predicate over claims (the properties of the subject) or by nesting another group."
    name: Group member
  - description: "Global roles: named sets of permissions. A role is not a subject: an assignment rule grants it (role_id)."
    name: Role
  - description: "The items of a role: access levels on a target of a resource type."
    name: Role permission
  - description: Rules granting access to a resource type or a specific resource.
    name: AssignmentRule
  - description: "Self-service: Licetum registered within itself. The admin API is protected by its policies — the resource types service, type_resource (with its synchronizers and resources), group, group_member, role and assignment_rule: listing needs read on the entities (the list is filtered), changing an entity needs write on it, creating needs write on the whole type."
    name: Platform
  - description: Service endpoints.
    name: System
  - description: "The record of every change the admin API makes: who made it, when, and the entity before and after the change."
    name: Change log
  - description: "Several writes in one transaction, and the history of the policy: reverting one change, or rolling back to a position of the change log."
    name: Batch
  - description: "The tools of a service's policy: tests with their coverage, the linter, and the export and import of the policy as a document."
    name: Policy
  - description: "The structure of the process logs: format, the fields and their names, the event categories, the treatment of the subject and the sampling of allowed decisions."
    name: Log settings
  - description: "The subject directory of a service: the people its application sent, with their properties and the groups they are in."
    name: Subject
  - description: "What a subject with given properties would be allowed to do, asked as the AuthZEN API of the PDP asks it and without a PEP client: for administrators checking the rules."
    name: Simulation

