      parameters:
        - description: Service id
          in: path
          name: service_id
          required: true
          schema:
            description: Service id
            format: uuid
            type: string
        - description: Return the plan of the import and apply nothing
          explode: false
          in: query
          name: dry_run
          schema:
            description: Return the plan of the import and apply nothing
            type: boolean
        - description: Also delete the rules of the service that the document does not have. Without it, such rules are kept
