          minimum: 1
          type:
            - integer
            - "null"
      required:
        - retention_days
      type: object
    DirectoryWriteResult:
      additionalProperties: false
      properties:
        created:
          description: Entries that were new
          format: int64
          type: integer
        unchanged:
          description: "Entries that were already as sent: nothing was written to them, and the time they were last sent moved"
          format: int64
          type: integer
        updated:
          description: Entries whose name or properties changed
          format: int64
          type: integer
      required:
        - created
        - updated
        - unchanged
      type: object
    Error:
      additionalProperties: false
      properties:
        detail:
          description: Human-readable error description in the language negotiated via Accept-Language
          type: string
        extra:
          $ref: "#/components/schemas/Extra"
          description: Machine-readable details
      required:
        - detail
        - extra
      type: object
    Extra:
      additionalProperties: false
      properties:
        blocked_by:
          description: "For type=blocked_by: which entities prevent the deletion"
          examples:
            - - assignment_rule
          items:
            type: string
          type:
            - array
            - "null"
        code:
          description: Stable machine-readable error code, independent of the response language
          examples:
            - service_not_found
          type: string
        missing:
          description: "For type=missing: which fields or sources are unavailable"
          examples:
            - - url
          items:
            type: string
          type:
            - array
            - "null"
        operation:
          description: "For a batch: the index of the operation that failed; nothing of the batch was applied"
          examples:
            - 2
          format: int64
          type: integer
        type:
          description: Kind of error
          enum:
            - generic
            - missing
            - provider_unavailable
            - blocked_by
          type: string
      required:
        - type
      type: object
    GrantConflict:
      additionalProperties: false
      properties:
        kind:
          description: A denial, or an exception that lifts denials
          enum:
            - deny
            - exception
          type: string
        name:
          description: Its name; null when it has none
          type:
            - string
            - "null"
        position:
          description: "above: it covers what the rule covers; inside: it covers a part of it"
          enum:
            - above
            - inside
          type: string
        rule:
          $ref: "#/components/schemas/RuleRef"
          description: The rule in force
        who:
          $ref: "#/components/schemas/AccessWho"
          description: Whom it applies to
      required:
        - position
        - kind
        - rule
        - name
        - who
      type: object
    GrantPeople:
      additionalProperties: false
      properties:
        limited:
          description: The directories are larger than what was tried
          type: boolean
        registry:
          description: People of the directories of the rule's services that the rule was tried on; 0 — those directories are empty, nothing is said about people
          format: int64
          type: integer
        sample:
          description: The first of them (up to 20)
          items:
            $ref: "#/components/schemas/KnownPerson"
          type: array
        total:
          description: How many people of the directory
          format: int64
          type: integer
      required:
        - total
        - sample
        - registry
        - limited
      type: object
    GrantPreview:
      additionalProperties: false
      properties:
        already_granted:
          description: Rules in force that already give the same people the same levels on the same target
          items:
            $ref: "#/components/schemas/RuleRef"
          type: array
        capability:
          description: "The rule is on a type without a source: it grants a permission without resources, so there is nothing to count"
          type: boolean
        conflicts:
          description: "Denials and exceptions in force that meet the rule: a denial above it or inside it narrows or cancels what it grants"
          items:
            $ref: "#/components/schemas/GrantConflict"
          type: array
        dynamic:
          description: "The rule finds its resource from a claim of whoever asks, so what it covers depends on the person: Resources does not count it"
          type: boolean
        people:
          $ref: "#/components/schemas/GrantPeople"
          description: The known subjects the rule would reach
        resources:
          description: How many resources the rule covers now (the resources of the synced types it reaches, through the hierarchy)
          format: int64
          type: integer
        sample:
          description: The names of the first covered resources
          items:
            type: string
          type: array
        types:
          description: The covered resources by type
          items:
            $ref: "#/components/schemas/GrantPreviewType"
          type: array
        who:
          $ref: "#/components/schemas/AccessWho"
          description: Whom the rule applies to
      required:
        - resources
        - types
        - sample
        - capability
        - dynamic
        - who
        - people
        - conflicts
        - already_granted
      type: object
    GrantPreviewType:
      additionalProperties: false
      properties:
        count:
          description: Covered resources of the type
          format: int64
          type: integer
        service:
          description: Name of its service
          type: string
        type:
          description: Name of the resource type
          type: string
      required:
        - type
        - service
        - count
      type: object
    Group:
