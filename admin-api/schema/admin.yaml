          minItems: 1
          type:
            - array
            - "null"
      required:
        - cases
      type: object
    PolicyTestReport:
      additionalProperties: false
      properties:
        cases:
          description: The outcome of each scenario, in order
          items:
            $ref: "#/components/schemas/PolicyTestCaseResult"
          type: array
        coverage:
          $ref: "#/components/schemas/PolicyCoverage"
          description: How much of the policy the scenarios exercised
        failed:
          description: How many scenarios do not hold
          format: int64
          type: integer
        passed:
          description: How many scenarios hold
          format: int64
          type: integer
      required:
        - passed
        - failed
        - cases
        - coverage
      type: object
    PredicateCondition:
      additionalProperties: false
      properties:
        attr:
          description: "The attribute: a claim name (source claim), a key of the request context (source context), or hour or weekday (source now)"
          examples:
            - department
          type: string
        op:
          description: "Operator: eq — equality, ne — inequality, in — membership in a list, not_in — absence from a list, regex — regular expression search (RE2), gt, ge, lt, le — numeric comparison, in_cidr — the address lies in one of the networks. An attribute the request does not carry never satisfies a condition of an allow rule; ne and not_in included"
          enum:
            - eq
            - ne
            - in
            - not_in
            - regex
            - gt
            - ge
            - lt
            - le
            - in_cidr
          type: string
        source:
          description: "Where the attribute comes from: claim (a claim of the subject, the default), context (a key of the request context) or now (hour 0-23 or weekday 1-7, Monday is 1, in UTC)"
          enum:
            - claim
            - context
            - now
          type: string
        value:
          description: "The value to compare with: a string, or a list for in, not_in and in_cidr"
          examples:
            - sales
            - - sales
              - marketing
          oneOf:
            - type: string
            - items:
                type: string
              type: array
      required:
        - attr
        - op
        - value
      type: object
    ReadyOutputBody:
      additionalProperties: false
      properties:
        status:
