            - user
          maxLength: 64
          type: string
        name:
          description: "The attribute: request_id, method, path, operation, user, status, duration_ms, service, subject, type, resource_id, action, allowed, consistency, or a built-in key (time, level, msg)"
          examples:
            - subject
          maxLength: 64
          minLength: 1
          type: string
      required:
        - name
      type: object
    LogSettings:
      additionalProperties: false
      properties:
        events:
          $ref: "#/components/schemas/LogEvents"
