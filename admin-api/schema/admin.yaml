components:
  schemas:
    AccessEntry:
      additionalProperties: false
      properties:
        assumed:
          description: "A denial that applies only because the resource has a parent that is not in the cache yet: none of its levels reaches the resource for real"
          type: boolean
        assumed_levels:
          description: The levels of a denial that reach the resource only because it has a parent that is not in the cache yet (fail closed); the other levels reach it for real
          items:
            type: string
          type: array
        expires_at:
          description: When the rule stops; null — never
          format: date-time
          type:
            - string
            - "null"
        levels:
          description: "The levels that reach the resource: what the rule gives, cut by what the links let flow down"
          items:
            type: string
          type: array
        name:
          description: The name of the rule; null when it has none
          type:
            - string
            - "null"
        people:
          description: People of the directory the rule applies to (up to 20)
          items:
            $ref: "#/components/schemas/KnownPerson"
          type: array
        people_total:
          description: How many people of the directory the rule applies to
          format: int64
          type: integer
        role:
          $ref: "#/components/schemas/NamedID"
          description: The role the rule grants; null for an inline rule
        rule:
          $ref: "#/components/schemas/RuleRef"
          description: The rule, as an explanation names it
        valid_from:
          description: When the rule starts; null — it has started
          format: date-time
          type:
            - string
            - "null"
        via:
          description: "How the rule reaches the resource: anchored on it (resource), on an ancestor (ancestor), on its type or a higher one (type), on the resources whose attributes match (attribute), or found by a claim (claim)"
          enum:
            - resource
            - ancestor
            - type
            - attribute
            - claim
          type: string
        who:
          $ref: "#/components/schemas/AccessWho"
          description: Whom the rule applies to
      required:
        - rule
        - name
        - via
        - levels
        - who
        - role
        - expires_at
        - valid_from
        - assumed
        - assumed_levels
        - people
        - people_total
      type: object
    AccessGroup:
      additionalProperties: false
      properties:
        id:
          description: Access group id
          format: uuid
          type: string
        levels:
          description: The access levels the group stands for
          items:
            type: string
          type:
            - array
            - "null"
        name:
          description: The name; a rule or an item refers to it as @name
          type: string
        type_resource_id:
          description: Id of the resource type the group belongs to
          format: uuid
          type: string
      required:
        - id
        - type_resource_id
        - name
        - levels
      type: object
    AccessGroupInput:
      additionalProperties: true
      properties:
        levels:
          description: The access levels the group stands for. A level is neither * nor a group reference
          examples:
            - - read
              - write
          items:
            type: string
          minItems: 1
          type: array
        name:
          description: "The name: a rule or a role item of this resource type refers to the group as @name. Letters, digits, _ and -"
          examples:
            - editor
          maxLength: 64
          minLength: 1
          type: string
      required:
        - name
        - levels
      type: object
    AccessLookup:
      additionalProperties: false
      properties:
        dynamic:
          description: "Rules that find their resource from a claim of whoever asks: whether they reach this one depends on that person's claims"
          items:
            $ref: "#/components/schemas/AccessEntry"
          type: array
        entries:
          description: The rules that cover the resource, denials included
          items:
            $ref: "#/components/schemas/AccessEntry"
          type: array
        name:
          description: Name of the resource; null for the type as a whole
          type:
            - string
            - "null"
        people:
          $ref: "#/components/schemas/AccessPeople"
          description: What is known of the people the entries reach
        resource_id:
          description: The resource asked about; null for the type as a whole
          type:
            - string
            - "null"
        type:
          description: Name of the resource type
          type: string
      required:
        - type
        - resource_id
        - name
        - entries
        - dynamic
        - people
      type: object
    AccessPeople:
      additionalProperties: false
      properties:
        limited:
          description: The directories are larger than what was tried
          type: boolean
        registry:
          description: People of the directories of the rules' services that the rules were tried on; 0 — those directories are empty, nothing is said about people
          format: int64
          type: integer
      required:
        - registry
        - limited
      type: object
    AccessWho:
      additionalProperties: false
      properties:
        group:
          $ref: "#/components/schemas/NamedID"
          description: The group, for kind group
        guarded:
          description: The rule has a guard (requires_predicate or requires_group_id) that narrows whom it reaches
          type: boolean
        kind:
          description: A subject, a group, everyone whose claims satisfy conditions, or everyone who signs in
          enum:
            - user
            - group
            - condition
            - everyone
          type: string
        predicate:
          description: The conditions, for kind condition
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type: array
        subject:
          description: The subject, for kind user
          type:
            - string
            - "null"
      required:
        - kind
        - subject
        - group
        - predicate
        - guarded
      type: object
    Anchor:
      additionalProperties: false
      properties:
        resource_id:
          description: The resource the rule is anchored on; null — the whole type
          type:
            - string
            - "null"
        type:
          description: Name of the resource type the rule is anchored on
          type: string
      required:
        - type
        - resource_id
      type: object
    AssignmentRule:
      additionalProperties: false
      properties:
        access:
          description: Access levels of the inline permission; null for a role rule
          items:
            type: string
          type:
            - array
            - "null"
        description:
          description: What the rule is for; null when there is no description
          type:
            - string
            - "null"
        effect:
          description: allow or deny
          enum:
            - allow
            - deny
          type: string
        enabled:
          description: Whether the rule is active
          type: boolean
        exception:
          description: An allow rule that lifts the denials above it
          type: boolean
        expires_at:
          description: The rule stops taking effect at this moment; null — never
          format: date-time
          type:
            - string
            - "null"
        id:
          description: Rule id
          format: uuid
          type: string
        member_of_group_id:
          description: Group whose members are granted access
          format: uuid
          type: string
        name:
          description: The name of the rule; null when it has none
          type:
            - string
            - "null"
        on_missing_attribute:
          description: "What a denial does when a condition reads an attribute the request does not carry: skip or apply (see the input)"
          enum:
            - skip
            - apply
          type: string
        predicate:
          description: AND conditions over the claims and the request
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type:
            - array
            - "null"
        requires_group_id:
          description: "The guard: the subject must be a member of this group; null when there is no such guard"
          format: uuid
          type:
            - string
            - "null"
        requires_predicate:
          description: The guard conditions that must hold as well for the rule to apply
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type: array
        resource_from_claim:
          $ref: "#/components/schemas/ResourceFromClaim"
          description: Dynamic resource_id computed from a claim
        resource_id:
          description: Resource id; null means the whole type
          type:
            - string
            - "null"
        resource_where:
          description: The conditions over the resource attributes the rule covers; null for a rule on a resource id, on a claim or on the whole type
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type:
            - array
            - "null"
        role_id:
          description: Role whose permissions the rule grants; null for an inline rule
          format: uuid
          type: string
        subject:
          description: A specific subject or group (group:{uuid})
          type:
            - string
            - "null"
        subject_kind:
          description: "The label of the subject: user, service, agent or group; null when there is none"
          type:
            - string
            - "null"
        type_resource_id:
          description: Resource type id of the inline permission; null for a role rule
          format: uuid
          type: string
        valid_from:
          description: The rule takes effect from this moment; null — right away
          format: date-time
          type:
            - string
            - "null"
      required:
        - id
        - role_id
        - type_resource_id
        - resource_id
        - resource_from_claim
        - access
        - subject
        - predicate
        - member_of_group_id
        - enabled
        - effect
        - exception
        - valid_from
        - expires_at
        - name
        - description
        - on_missing_attribute
        - requires_predicate
        - requires_group_id
        - resource_where
        - subject_kind
      type: object
    AssignmentRuleInput:
      additionalProperties: true
      properties:
        access:
          description: Access levels of the inline permission (read, write, ...); required without role_id
          examples:
            - - read
              - write
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
        description:
          description: What the rule is for. Optional
          maxLength: 2000
          type:
            - string
            - "null"
        effect:
          default: allow
          description: allow grants the access levels; deny takes them away from everything the rule covers, whatever the allow rules say, unless an exception below the denial lifts it
          enum:
            - allow
            - deny
          type: string
        enabled:
          default: true
          description: Whether the rule is active
          type:
            - boolean
            - "null"
        exception:
          description: "Only for allow rules: the rule lifts the denials that lie strictly above it in the hierarchy, for the resources it covers"
          type: boolean
        expires_at:
          description: The rule stops taking effect at this moment (RFC 3339); omitted or null — never
          format: date-time
          type:
            - string
            - "null"
        member_of_group_id:
          description: The rule applies to everyone who is a member of this group; mutually exclusive with subject and predicate
          format: uuid
          type: string
        name:
          description: "A name for the rule: it names the rule in the change log and in the explanations. Optional"
          examples:
            - Sales can read the branches
          maxLength: 200
          type:
            - string
            - "null"
        on_missing_attribute:
          description: "Only for deny rules: what the denial does when a condition reads an attribute the request does not carry. skip: the condition does not hold, the denial does not apply (the behaviour before this option existed); apply: the denial applies (fail closed). A new deny rule defaults to apply; an allow rule always skips, it grants nothing on a missing attribute"
          enum:
            - skip
            - apply
          type:
            - string
            - "null"
        predicate:
          description: AND conditions over the claims and the request; mutually exclusive with subject and member_of_group_id
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type:
            - array
            - "null"
        requires_group_id:
          description: "A guard: the subject must be a member of this group for the rule to apply"
          format: uuid
          type:
            - string
            - "null"
        requires_predicate:
          description: "A guard: conditions that must hold as well for the rule to apply, in addition to its subject, group or predicate"
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type: array
        resource_from_claim:
          $ref: "#/components/schemas/ResourceFromClaim"
          description: Compute resource_id dynamically from a claim of the subject; mutually exclusive with resource_id
        resource_id:
          description: Resource id; null means the rule covers the whole resource type (if resource_from_claim is not set either)
          type:
            - string
            - "null"
        resource_where:
          description: Covers the resources of the type whose attributes (as the synchronizer reported them) match these conditions. Mutually exclusive with resource_id and resource_from_claim; needs a synchronizer
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type:
            - array
            - "null"
        role_id:
          description: "Id of a role: grants all its permissions. Mutually exclusive with the inline permission (type_resource_id, resource_id, resource_from_claim, access)"
          format: uuid
          type: string
        subject:
          description: A specific subject or group (group:{uuid}); mutually exclusive with predicate and member_of_group_id
          examples:
            - alice
          type:
            - string
            - "null"
        subject_kind:
          description: "A label of the subject: user, service, agent or group. It classifies the rule; it does not change what matches"
          enum:
            - user
            - service
            - agent
            - group
          type:
            - string
            - "null"
        type_resource_id:
          description: Id of the resource type the inline permission applies to (of any service); required without role_id
          format: uuid
          type: string
        valid_from:
          description: The rule takes effect from this moment (RFC 3339); omitted or null — right away
          format: date-time
          type:
            - string
            - "null"
      type: object
    AssignmentRuleWithContext:
      additionalProperties: false
      properties:
        access:
          description: Access levels of the inline permission; null for a role rule
          items:
            type: string
          type:
            - array
            - "null"
        description:
          description: What the rule is for; null when there is no description
          type:
            - string
            - "null"
        effect:
          description: allow or deny
          enum:
            - allow
            - deny
          type: string
        enabled:
          description: Whether the rule is active
          type: boolean
        exception:
          description: An allow rule that lifts the denials above it
          type: boolean
        expires_at:
          description: The rule stops taking effect at this moment; null — never
          format: date-time
          type:
            - string
            - "null"
        id:
          description: Rule id
          format: uuid
          type: string
        member_of_group_id:
          description: Group whose members are granted access
          format: uuid
          type: string
        name:
          description: The name of the rule; null when it has none
          type:
            - string
            - "null"
        on_missing_attribute:
          description: "What a denial does when a condition reads an attribute the request does not carry: skip or apply (see the input)"
          enum:
            - skip
            - apply
          type: string
        predicate:
          description: AND conditions over the claims and the request
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type:
            - array
            - "null"
        requires_group_id:
          description: "The guard: the subject must be a member of this group; null when there is no such guard"
          format: uuid
          type:
            - string
            - "null"
        requires_predicate:
          description: The guard conditions that must hold as well for the rule to apply
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type: array
        resource_from_claim:
          $ref: "#/components/schemas/ResourceFromClaim"
          description: Dynamic resource_id computed from a claim
        resource_id:
          description: Resource id; null means the whole type
          type:
            - string
            - "null"
        resource_where:
          description: The conditions over the resource attributes the rule covers; null for a rule on a resource id, on a claim or on the whole type
          items:
            $ref: "#/components/schemas/PredicateCondition"
          type:
            - array
            - "null"
        role_id:
          description: Role whose permissions the rule grants; null for an inline rule
          format: uuid
          type: string
        role_name:
          description: Name of the granted role; null for an inline rule
          type:
            - string
            - "null"
        service_id:
          description: Id of the service that owns the resource type; null for a role rule
          format: uuid
          type: string
        service_name:
          description: Name of the service that owns the resource type; null for a role rule
          type:
            - string
            - "null"
        subject:
          description: A specific subject or group (group:{uuid})
          type:
            - string
            - "null"
        subject_kind:
          description: "The label of the subject: user, service, agent or group; null when there is none"
          type:
            - string
            - "null"
        target_valid:
          description: "Whether the rule's target can take effect: false for a rule on a specific resource (resource_id or resource_from_claim) of a type that has no synchronizer and hence no resources — e.g. after its synchronizer was deleted — and for a resource_from_claim that looks a resource up in, or climbs through, such a type. A denial of that kind still applies below the links to the resources the type left"
          type: boolean
        type_resource_id:
          description: Resource type id of the inline permission; null for a role rule
          format: uuid
          type: string
        type_resource_name:
          description: Resource type name; null for a role rule
          type:
            - string
            - "null"
        valid_from:
          description: The rule takes effect from this moment; null — right away
          format: date-time
          type:
            - string
            - "null"
      required:
        - service_id
        - service_name
        - type_resource_name
        - role_name
        - target_valid
        - id
        - role_id
        - type_resource_id
        - resource_id
        - resource_from_claim
        - access
        - subject
        - predicate
        - member_of_group_id
        - enabled
        - effect
        - exception
        - valid_from
        - expires_at
        - name
        - description
        - on_missing_attribute
        - requires_predicate
        - requires_group_id
        - resource_where
        - subject_kind
      type: object
    AuthzenAction:
      additionalProperties: true
      properties:
        name:
          description: Access level
          examples:
            - write
          type: string
        properties:
          additionalProperties: {}
          description: Ignored
          type: object
      required:
        - name
      type: object
    AuthzenActionSearchRequest:
      additionalProperties: true
      properties:
        context:
          additionalProperties: {}
          description: The attributes of the request that the rules may read (conditions with source context)
          type: object
        page:
          $ref: "#/components/schemas/AuthzenPageRequest"
          description: Which page of the results is asked for
        resource:
          $ref: "#/components/schemas/AuthzenResource"
          description: The resource (resource.type is required; an empty resource.id, or *, is the type as a whole)
        subject:
          $ref: "#/components/schemas/AuthzenSubject"
          description: The person asked about (subject.type and subject.id are required)
      type: object
    AuthzenActionSearchResponse:
      additionalProperties: false
      properties:
        context:
          additionalProperties: {}
          description: Extra information
          type: object
        page:
          $ref: "#/components/schemas/AuthzenPageResponse"
          description: Paging of the results
        results:
          description: The access levels the subject has on the resource
          items:
            $ref: "#/components/schemas/AuthzenAction"
          type: array
      required:
        - results
      type: object
    AuthzenEvaluationRequest:
      additionalProperties: true
      properties:
        action:
          $ref: "#/components/schemas/AuthzenAction"
          description: The access level asked for (action.name is required)
        context:
          additionalProperties: {}
          description: "The attributes of the request that the rules may read (conditions with source context). context.licetum holds the settings of Licetum: {\"explain\": true} adds the explanation of the decision to the response context"
          type: object
        resource:
          $ref: "#/components/schemas/AuthzenResource"
          description: What is accessed (resource.type and resource.id are required; * is the type as a whole)
        subject:
          $ref: "#/components/schemas/AuthzenSubject"
          description: The person asked about (subject.type and subject.id are required)
      type: object
    AuthzenEvaluationResponse:
      additionalProperties: false
      properties:
        context:
          additionalProperties: {}
          description: "With explain: reason_admin holds the explanation. In a batch, error holds the status and the message of an evaluation that could not be decided (the decision is then false); a short-circuited batch names the semantic in reason"
          type: object
        decision:
          description: Whether the access is granted
          type: boolean
      required:
        - decision
      type: object
    AuthzenEvaluationsRequest:
      additionalProperties: true
      properties:
        action:
          $ref: "#/components/schemas/AuthzenAction"
          description: Default action
        context:
          additionalProperties: {}
          description: Default context
          type: object
        evaluations:
          description: "The evaluations, up to 100. Absent or empty: the top-level subject, resource, action and context are one evaluation, and the answer is a single decision"
          items:
            $ref: "#/components/schemas/AuthzenEvaluationRequest"
          maxItems: 100
          type:
            - array
            - "null"
        options:
          $ref: "#/components/schemas/AuthzenOptions"
          description: How the evaluations are executed
        resource:
          $ref: "#/components/schemas/AuthzenResource"
          description: Default resource
        subject:
          $ref: "#/components/schemas/AuthzenSubject"
          description: Default subject
      type: object
    AuthzenEvaluationsResponse:
      additionalProperties: false
      properties:
        context:
          additionalProperties: {}
          description: "With explain: reason_admin holds the explanation of the decision of a request without evaluations"
          type: object
        decision:
          description: The decision of a request without evaluations; absent when evaluations were given
          type: boolean
        evaluations:
          description: Decisions in the order asked (fewer when the semantic stopped the batch)
          items:
            $ref: "#/components/schemas/AuthzenEvaluationResponse"
          type:
            - array
            - "null"
      type: object
    AuthzenOptions:
      additionalProperties: true
      properties:
        evaluations_semantic:
          description: execute_all (the default) answers every evaluation; deny_on_first_deny stops after the first denial or error; permit_on_first_permit stops after the first permit. The evaluations after the one that stops the batch are not answered
          enum:
            - execute_all
            - deny_on_first_deny
            - permit_on_first_permit
          type: string
      type: object
    AuthzenPageRequest:
      additionalProperties: true
      properties:
        limit:
          description: At most this many results; absent or 0 — the most the service gives in one page (1000)
          format: int64
          minimum: 0
          type:
            - integer
            - "null"
        properties:
          additionalProperties: {}
          description: Ignored
          type: object
        token:
          description: The next_token of the previous page. The subject, resource, action, context and limit must be the same as in the request that gave it
          type: string
      type: object
    AuthzenPageResponse:
      additionalProperties: false
      properties:
        count:
          description: The number of results on this page
          format: int64
          type: integer
        next_token:
          description: Pass it as page.token to read the next page; empty on the last page
          type: string
        total:
          description: The number of results of the whole search at the time of the request; absent when the search does not know it (the resource and the subject searches)
          format: int64
          type: integer
      required:
        - next_token
        - count
      type: object
    AuthzenResource:
      additionalProperties: true
      properties:
        id:
          description: Resource id in the external system. An evaluation requires it, and * names the type as a whole; the action search reads an empty id or * as the type as a whole; the resource search ignores it
          examples:
            - b1
          type: string
        properties:
          additionalProperties: {}
          description: Ignored in a request; the resource search returns the name of the resource here
          type: object
        type:
          description: Name of the resource type in the service
          examples:
            - branch
          type: string
      required:
        - type
      type: object
    AuthzenResourceSearchRequest:
      additionalProperties: true
      properties:
        action:
          $ref: "#/components/schemas/AuthzenAction"
          description: The access level (action.name is required)
        context:
          additionalProperties: {}
          description: The attributes of the request that the rules may read (conditions with source context)
          type: object
        page:
          $ref: "#/components/schemas/AuthzenPageRequest"
          description: Which page of the results is asked for
        resource:
          $ref: "#/components/schemas/AuthzenResource"
          description: The type of the resources searched for (resource.type is required; resource.id is ignored)
        subject:
          $ref: "#/components/schemas/AuthzenSubject"
          description: The person asked about (subject.type and subject.id are required)
      type: object
    AuthzenResourceSearchResponse:
      additionalProperties: false
      properties:
        context:
          additionalProperties: {}
          description: Extra information
          type: object
        page:
          $ref: "#/components/schemas/AuthzenPageResponse"
          description: Paging of the results
        results:
          description: The resources the subject may do the action on; properties.name is the name of the resource
          items:
            $ref: "#/components/schemas/AuthzenResource"
          type: array
      required:
        - results
      type: object
    AuthzenSubject:
      additionalProperties: true
      properties:
        id:
          description: "Subject id: 1 to 256 characters, no control characters, and not a group (group:…). Required by evaluations and by the resource and action searches; ignored by the subject search, which returns it"
          examples:
            - alice
          type: string
        properties:
          additionalProperties: {}
          description: "The claims of the person that the rules read (department, groups, ...): at most 100 claims and 16 KiB of JSON. preferred_username is the subject id unless it is given"
          type: object
        type:
          description: "Subject type (not interpreted): 1 to 64 characters, and not group"
          examples:
            - user
          type: string
      required:
        - type
      type: object
    AuthzenSubjectSearchRequest:
      additionalProperties: true
      properties:
        action:
          $ref: "#/components/schemas/AuthzenAction"
          description: The access level (action.name is required)
        context:
          additionalProperties: {}
          description: The attributes of the request that the rules may read (conditions with source context)
          type: object
        page:
          $ref: "#/components/schemas/AuthzenPageRequest"
          description: Which page of the results is asked for
        resource:
          $ref: "#/components/schemas/AuthzenResource"
          description: The resource (resource.type is required; an empty resource.id, or *, is the type as a whole)
        subject:
          $ref: "#/components/schemas/AuthzenSubject"
          description: "The subject: only its type is used (subject.type is required; subject.id is ignored)"
      type: object
    AuthzenSubjectSearchResponse:
      additionalProperties: false
      properties:
        page:
          $ref: "#/components/schemas/AuthzenPageResponse"
          description: Paging of the results
        results:
          description: The subjects that may do the action on the resource
          items:
            $ref: "#/components/schemas/AuthzenSubject"
          type: array
      required:
        - results
      type: object
    BatchInput:
      additionalProperties: true
      properties:
        operations:
          description: "The operations, applied in order in one transaction: all of them take effect, or none. An operation sees the writes of the ones before it. An entity created by an operation is named by its id in the next ones, so give a create an id when later operations need it"
          items:
            $ref: "#/components/schemas/BatchOperation"
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
      required:
        - operations
      type: object
    BatchOperation:
      additionalProperties: false
      properties:
        body:
          description: "The input of the entity, as its endpoint takes it: for a create and an update"
        entity:
          description: "The kind of entity: an assignment_rule, a group, a group_member (of the group in parent), a role, a role_permission (an item of the role in parent) or an access_group (of the resource type in parent)"
          enum:
            - assignment_rule
            - group
            - group_member
            - role
            - role_permission
            - access_group
          type: string
        id:
          description: "The entity of an update or a delete. For a create: the id the entity gets; absent — a new id"
          format: uuid
          type: string
        op:
          description: create makes the entity, update changes it with its body, delete removes it
          enum:
            - create
            - update
            - delete
          type: string
        parent:
          description: "The entity the operation belongs to: the group of a group_member, the role of a role_permission, the resource type of an access_group"
          format: uuid
          type: string
      required:
        - op
        - entity
      type: object
    BatchResponse:
      additionalProperties: false
      properties:
        results:
          description: One result per operation, in order
          items:
            $ref: "#/components/schemas/BatchResult"
          type: array
      required:
        - results
      type: object
    BatchResult:
      additionalProperties: false
      properties:
        entity:
          description: The kind of entity
          type: string
        id:
          description: The entity the operation wrote
          format: uuid
          type: string
        index:
          description: Position of the operation in the batch
          format: int64
          type: integer
        op:
          description: What the operation did
          enum:
            - create
            - update
            - delete
          type: string
      required:
        - index
        - op
        - entity
        - id
      type: object
    ChangeRecord:
      additionalProperties: false
      properties:
        action:
          description: What was done
          enum:
            - create
            - update
            - delete
          type: string
        actor:
          description: The subject that made the change; empty for a change made outside a request
          type: string
        after:
          description: The entity after the change; null for a delete
          type:
            - ""
            - "null"
        at:
          description: When the change was made
          format: date-time
          type: string
        before:
          description: The entity before the change; null for a create
          type:
            - ""
            - "null"
        entity:
          description: "The kind of entity: service, type_resource, synchronizer, group, group_member, role, role_permission, assignment_rule or log_settings"
          type: string
        entity_id:
          description: The id of the entity; null for the log settings
          format: uuid
          type:
            - string
            - "null"
        id:
          description: Position in the log; it grows with every change. Pass it as after to read the records that follow
          format: int64
          type: integer
        service_id:
          description: The service the entity belongs to; null for the platform-wide entities
          format: uuid
          type:
            - string
            - "null"
      required:
        - id
        - at
        - actor
        - service_id
        - entity
        - entity_id
        - action
        - before
        - after
      type: object
    DirectoryEntry:
      additionalProperties: false
      properties:
        id:
          description: The id of the subject
          type: string
        name:
          description: The name to show; empty when none was sent
          type: string
        properties:
          additionalProperties: {}
          description: The properties of the subject, as they were sent
          type: object
        sent_at:
          description: "When the entry was last sent (refreshed at most hourly): what the retention counts from"
          format: date-time
          type: string
        type:
          description: The type of the subject
          type: string
        updated_at:
          description: When the name or the properties last changed
          format: date-time
          type: string
      required:
        - type
        - id
        - name
        - properties
        - updated_at
        - sent_at
      type: object
    DirectoryEntryDetail:
      additionalProperties: false
      properties:
        groups:
          description: The groups the person is in now, nested groups included, decided with the stored properties
          items:
            $ref: "#/components/schemas/SubjectGroup"
          type: array
        id:
          description: The id of the subject
          type: string
        name:
          description: The name to show; empty when none was sent
          type: string
        properties:
          additionalProperties: {}
          description: The properties of the subject, as they were sent
          type: object
        sent_at:
          description: "When the entry was last sent (refreshed at most hourly): what the retention counts from"
          format: date-time
          type: string
        type:
          description: The type of the subject
          type: string
        updated_at:
          description: When the name or the properties last changed
          format: date-time
          type: string
      required:
        - groups
        - type
        - id
        - name
        - properties
        - updated_at
        - sent_at
      type: object
    DirectoryEntryInput:
      additionalProperties: true
      properties:
        id:
          description: The id of the subject as the rules name it and the PEPs send it (subject.id)
          examples:
            - alice
          maxLength: 512
          minLength: 1
          type: string
        name:
          description: The name to show for the subject; it is what a subject search returns as properties.name
          examples:
            - Alice Liddell
          maxLength: 256
          type: string
        properties:
          additionalProperties: {}
          description: "The properties of the subject (subject.properties): the claims the rules read, stored as sent, at most 100 of them and 16 KiB in all"
          type: object
        type:
          description: "The type of the subject (the subject.type of AuthZEN); absent: user"
          examples:
            - user
          maxLength: 64
          type: string
      required:
        - id
      type: object
    DirectoryList:
      additionalProperties: false
      properties:
        items:
          description: The page, by type and then by id
          items:
            $ref: "#/components/schemas/DirectoryEntry"
          type: array
        total:
          description: How many entries match
          format: int64
          type: integer
      required:
        - total
        - items
      type: object
    DirectoryPut:
      additionalProperties: true
      properties:
        subjects:
          description: The people to write, at most 1000 per call, each once. An entry that is already as sent is left untouched; the others are created or replaced as a whole
          items:
            $ref: "#/components/schemas/DirectoryEntryInput"
          maxItems: 1000
          minItems: 1
          type:
            - array
            - "null"
      required:
        - subjects
      type: object
    DirectorySettings:
      additionalProperties: true
      properties:
        retention_days:
          description: "Days an entry that is not sent again is kept; null: until it is deleted"
          format: int64
