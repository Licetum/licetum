      operationId: list_changes
      parameters:
        - description: "Read the records after this position: the id of the last record of the previous read"
          explode: false
          in: query
          name: after
          schema:
            description: "Read the records after this position: the id of the last record of the previous read"
            format: int64
            minimum: 0
            type: integer
        - description: Only the records of this service
          explode: false
          in: query
          name: service_id
          schema:
            description: Only the records of this service
            format: uuid
            type: string
        - description: "Only the records of this kind of entity: service, type_resource, synchronizer, group, group_member, role, role_permission, assignment_rule or log_settings"
          explode: false
          in: query
          name: entity
          schema:
            description: "Only the records of this kind of entity: service, type_resource, synchronizer, group, group_member, role, role_permission, assignment_rule or log_settings"
            type: string
        - description: At most this many records
          explode: false
          in: query
          name: limit
          schema:
            default: 100
            description: At most this many records
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: "Seconds to wait for the first record after the position, when there is none yet: a client follows the log with it (a long poll)"
          explode: false
          in: query
