# The source of the resources of the "regional" type: reachable from region A only (it is on the network of region A and no other).
# Every request is logged with the address of the caller, which is how the test tells who asked.
events {}
http {
  log_format callers '$remote_addr "$request" $status';
  access_log /dev/stdout callers;
  default_type application/json;
  server {
    listen 80;
    location = /src {
      alias /www/list.json;
    }
    location ~ ^/src/(?<id>[^/]+)$ {
      return 200 '{"id":"$id","name":"Branch $id"}';
    }
  }
}
