name: Helm chart

# F6-12: the chart renders and validates (helm lint, the golden files, kubeconform), and installs into a kind cluster, where the smoke
# suite runs, a rolling upgrade under load loses no request and `helm upgrade` runs the migration exactly once.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'deploy/helm/**'
      - 'core/Dockerfile'
      - 'admin-api/Dockerfile'
      # A change of settings renders the chart (docs/adr/0001-regional-pdp.md, 10.7).
      - 'core/config/**'
      - '.github/workflows/helm.yml'

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.16.4
  KUBECONFORM_VERSION: v0.6.7

jobs:
  chart:
    name: Chart lint, golden files and kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@${{ env.KUBECONFORM_VERSION }}

      - name: helm lint, helm template against the golden files, kubeconform
        run: deploy/helm/test.sh

  kind:
    name: Install into kind
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: docker/setup-buildx-action@v4

      - name: Build the images
        run: |
          docker build -f core/Dockerfile --target runtime -t licetum:ci .
          docker build -f admin-api/Dockerfile --target runtime -t licetum-admin:ci .

      - uses: helm/kind-action@v1
        with:
          cluster_name: licetum

      - name: Load the images into the cluster
        run: kind load docker-image licetum:ci licetum-admin:ci --name licetum

      - name: Install, smoke suite, rolling upgrade, migration
        run: deploy/helm/kind-test.sh

      - name: State of the cluster
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n licetum-ci get jobs,events
          kubectl -n licetum-ci describe jobs | tail -n 80
          kubectl -n licetum-ci describe pods | tail -n 200
          kubectl -n licetum-ci logs -l app.kubernetes.io/instance=licetum --all-containers --tail=100 --prefix || true
