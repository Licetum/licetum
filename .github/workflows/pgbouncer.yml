name: Integration through PgBouncer

# The integration suites through PgBouncer in transaction mode (DB__PGBOUNCER: the simple protocol, no statement cache). They
# repeat the suites the pull request jobs run, against a pooler, so they run nightly (and on demand) instead of on every
# pull request (docs/adr/0001-regional-pdp.md, phase P0). The nightly dispatcher on main calls this workflow with the ref of
# the epic branch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test (default, the one the workflow is started on)
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to test
        type: string
        default: ""

permissions:
  contents: read

jobs:
  go-test-pgbouncer:
    name: Integration tests through PgBouncer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LICETUM_TEST_POSTGRES_URI: postgres://licetum:licetum@127.0.0.1:5432/postgres?sslmode=disable
      LICETUM_TEST_PGBOUNCER_ADDR: 127.0.0.1:6433
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            admin-api/go.sum

      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Every test makes a database, and PgBouncer keeps a few connections to each for a while: room for them.
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=licetum -e POSTGRES_PASSWORD=licetum postgres:16-alpine \
            -c max_connections=400
          until docker exec postgres pg_isready -U licetum -h 127.0.0.1; do sleep 1; done

      - name: Start PgBouncer in transaction mode
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer
          sudo systemctl stop pgbouncer || true
          sudo mkdir -p /etc/pgbouncer-ci /var/log/pgbouncer-ci
          printf '"licetum" "licetum"\n' | sudo tee /etc/pgbouncer-ci/userlist.txt > /dev/null
          sudo tee /etc/pgbouncer-ci/pgbouncer.ini > /dev/null <<'EOF'
          [databases]
          * = host=127.0.0.1 port=5432

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6433
          unix_socket_dir =
          auth_type = trust
          auth_file = /etc/pgbouncer-ci/userlist.txt
          pool_mode = transaction
          max_client_conn = 2000
          default_pool_size = 20
          max_db_connections = 40
          server_idle_timeout = 5
          max_prepared_statements = 200
          admin_users = licetum
          logfile = /var/log/pgbouncer-ci/pgbouncer.log
          pidfile = /var/log/pgbouncer-ci/pgbouncer.pid
          EOF
          sudo chown -R postgres /etc/pgbouncer-ci /var/log/pgbouncer-ci
          sudo -u postgres pgbouncer -d /etc/pgbouncer-ci/pgbouncer.ini
          until PGPASSWORD=licetum psql "host=127.0.0.1 port=6433 user=licetum dbname=postgres" -c 'select 1' > /dev/null; do sleep 1; done

      - name: Integration tests through PgBouncer
        run: task go:test:integration:pgbouncer

      - name: PgBouncer log
        if: failure()
        run: sudo tail -n 200 /var/log/pgbouncer-ci/pgbouncer.log
