name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go has no "none" build mode: CodeQL traces the build of both modules (core, and admin-api, which
          # replaces it with ../core), so the build is run explicitly between init and analyze.
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - uses: actions/setup-go@v6
        if: matrix.language == 'go'
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            admin-api/go.sum

      - name: Build the Go modules for CodeQL
        if: matrix.language == 'go'
        run: |
          (cd core && go build ./...)
          (cd admin-api && go build ./...)

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
