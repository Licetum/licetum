name: Release and publish Docker images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for unreleased Conventional Commits
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - id: version
        name: Calculate version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP: ${{ inputs.bump || 'auto' }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Releases can only be created from the main branch."
              exit 1
            fi

            if [[ "$BUMP" == "auto" ]]; then
              version="$(git cliff --bumped-version)"
            else
              version="$(git cliff --bumped-version --bump "$BUMP")"
            fi
            tag="v$version"

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag '$tag' already exists; there are no new changes to release."
              exit 1
            fi
          else
            tag="$PUSHED_TAG"
            version="${tag#v}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Tag '$tag' is not a valid semantic version. Expected vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git cliff --unreleased --tag "$TAG" --strip all --output RELEASE_NOTES.md
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Licetum $TAG" \
              --notes-file RELEASE_NOTES.md
          elif ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git cliff --current --strip all --output RELEASE_NOTES.md
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Licetum $TAG" \
              --notes-file RELEASE_NOTES.md
          fi

  publish:
    name: Publish ${{ matrix.image }} image
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            dockerfile: core/Dockerfile
            target: runtime
          - image: admin-api
            dockerfile: admin-api/Dockerfile
            target: runtime
          - image: web
            dockerfile: web/Dockerfile
            target: prod
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Image names must be lowercase; the repository is Licetum/licetum.
      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest,enable=${{ needs.release.outputs.stable == 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_CHECK_API_URL=${{ vars.VITE_CHECK_API_URL }}
