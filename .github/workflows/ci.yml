name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            go:
              - 'core/**'
              - 'admin-api/**'
              - 'contracts.yaml'
              - 'Taskfile.yaml'
              - 'docker-compose.yml'
              - 'infra/**'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - 'core/schema/**'
              - 'admin-api/schema/**'
              - 'Taskfile.yaml'
              - 'docker-compose.yml'
              - 'infra/**'
              - '.github/workflows/**'

  go-lint:
    name: Go lint and schema checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            admin-api/go.sum

      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"

      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Go lint
        run: task go:lint

  go-test:
    name: Go tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            admin-api/go.sum

      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Go tests and collect coverage
        run: task go:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: |
            core/reports/coverage.*
            admin-api/reports/coverage.*
          if-no-files-found: ignore

  # F5-11: the release that came before this change still works on the schema this change migrates (expand/contract,
  # CONTRIBUTING.md). The previous release is checked out, the migrations it embeds are replaced by the ones of this change,
  # and it runs its own integration tests: its code and its tests on the schema this change produces. A migration that drops,
  # renames or narrows what the previous release uses, or adds what its writes cannot fill, fails them here.
  #
  # The previous release still uses Redis: its own integration tests need the redis service and LICETUM_TEST_REDIS_URI below,
  # which is why they stay here after Redis left this repository (step 2e adds no migration, so the old release still runs on
  # the schema). The jobs of this change start no Redis; this one stays until P3 (docs/adr/0001-regional-pdp.md, 11.1).
  previous-release:
    name: Previous release on the new schema
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LICETUM_TEST_POSTGRES_URI: postgres://licetum:licetum@127.0.0.1:5432/postgres?sslmode=disable
      LICETUM_TEST_REDIS_URI: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the previous release
        id: previous
        run: |
          tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-' | head -n 1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then echo "::notice::there is no release yet, nothing to check"; else echo "the previous release is $tag"; fi

      - uses: actions/checkout@v7
        if: steps.previous.outputs.tag != ''
        with:
          ref: ${{ steps.previous.outputs.tag }}
          path: previous

      - uses: actions/setup-go@v7
        if: steps.previous.outputs.tag != ''
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            admin-api/go.sum
            previous/core/go.sum
            previous/admin-api/go.sum

      - name: Start PostgreSQL
        if: steps.previous.outputs.tag != ''
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=licetum -e POSTGRES_PASSWORD=licetum postgres:16-alpine
          until docker exec postgres pg_isready -U licetum -h 127.0.0.1; do sleep 1; done

      # The migrations are embedded in the binary of the previous release: the ones of this change take their place.
      - name: Give the previous release the migrations of this change
        if: steps.previous.outputs.tag != ''
        run: |
          rm previous/core/db/migrations/*.sql
          cp core/db/migrations/*.sql previous/core/db/migrations/

      - name: Integration tests of the previous release (core)
        if: steps.previous.outputs.tag != ''
        working-directory: previous/core
        run: go test -count=1 -timeout 30m -tags integration ./tests/integration/...

      - name: Integration tests of the previous release (admin API)
        if: steps.previous.outputs.tag != ''
        working-directory: previous/admin-api
        run: go test -count=1 -p 1 -timeout 45m -tags integration ./tests/integration/api/...

  web-check:
    name: Web lint, typecheck and build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Web lint and checks
        run: CI=true task web:lint

      # The development stack (docker-compose.yml and infra/*.compose.yml) is valid: includes, anchors and variables resolve.
      - name: Check the Compose file
        run: docker compose config -q

      - name: Web unit tests
        run: task web:test

      - name: Build web
        working-directory: web
        run: pnpm build

  # The PDP at the smoke volume (admin-api/loadtest): a ramp of three steps, a gate against gross regressions, not
  # a benchmark. A step passes on a valid window, errors within 1 %, and at least 95 % of the rate asked answered; the p99
  # of a 15-second step (about 750 requests) is not judged. The runners are shared, and the real numbers come from the
  # nightly loadtest.yml.
  loadtest-smoke:
    name: Load test (smoke volume)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            admin-api/go.sum

      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: grafana/setup-k6-action@v1.2.2
        with:
          k6-version: '2.2.0'

      - name: Load test at the smoke volume
        run: >
          task loadtest -- -profile smoke -ramp -rate-start 50 -rate-factor 2 -max-steps 3 -measure 15s
          -require-rate 50 -out reports/loadtest

      - name: Upload the load test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-smoke
          path: admin-api/reports/loadtest
          if-no-files-found: ignore

  dco:
    name: Developer Certificate of Origin
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every commit of the pull request ends with a Signed-off-by line (git commit -s), see CONTRIBUTING.md.
      - name: Check the sign-off of every commit
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
