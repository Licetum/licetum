name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            go:
              - 'core/**'
              - 'admin-api/**'
              - 'Taskfile.yaml'
              - 'docker-compose.yml'
              - 'infra/**'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - 'core/schema/**'
              - 'admin-api/schema/**'
              - 'Taskfile.yaml'
              - 'docker-compose.yml'
              - 'infra/**'
              - '.github/workflows/**'

  go-lint:
    name: Go lint and schema checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            admin-api/go.sum

      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Go lint
        run: task go:lint

  go-test:
    name: Go tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            admin-api/go.sum

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Go tests and collect coverage
        run: task go:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            core/reports/coverage.*
            admin-api/reports/coverage.*
          if-no-files-found: ignore

  web-check:
    name: Web lint, typecheck and build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Web lint and checks
        run: CI=true task web:lint

      - name: Web unit tests
        run: task web:test

      - name: Build web
        working-directory: web
        run: pnpm build

  dco:
    name: Developer Certificate of Origin
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Every commit of the pull request ends with a Signed-off-by line (git commit -s), see CONTRIBUTING.md.
      - name: Check the sign-off of every commit
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
