name: Verify chaos (temporary)

# Temporary: chaos.yml is not on the default branch, so GitHub neither schedules it nor lets it be started by hand. This
# file runs the same tests on a GitHub runner for this branch (head) and for the commit it is based on (base), once per
# change of this file (the last: the F5-8 load test with the 5x tolerance), so that a failure can be told from one that was there before. It is removed before the merge.
on:
  push:
    branches: [ccr-36b5903b-kne74a]
    paths: [.github/workflows/verify-chaos.yml]

permissions:
  contents: read

jobs:
  chaos:
    name: Fault injection (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: head
            ref: ""
          - name: base
            ref: 20ce6f2aebc7cc1d2d07f31f3682a37c0e72c2d6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref || github.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            admin-api/go.sum

      - name: Fault injection tests
        run: |
          cd admin-api
          set +e
          go test -race -count=1 -timeout 40m -tags chaos -v ./tests/integration/... > /tmp/chaos.log 2>&1
          echo "go test exited with $?"

      - name: Result of each test
        run: |
          echo "== ${{ matrix.name }} =="
          grep -E '^--- (PASS|FAIL|SKIP)' /tmp/chaos.log || true
          echo "== figures of F5-8 =="
          grep -E 'f5_8_test.go' /tmp/chaos.log || true
          echo "== messages of the failures =="
          grep -A8 -E '^--- FAIL' /tmp/chaos.log | grep -vE ' INFO | WARN ' || true
