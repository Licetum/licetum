  /service/{ref}/access/v1/search/subject:
    post:
      description: |-
        Lists the subjects of the type subject.type that may perform the action on the resource; subject.id is ignored. Only a PEP client with the search_subject operation may ask. The subjects are the people in the subject directory of the service — what its application sent — decided with their stored properties, so a person who is not in the directory is never listed and an empty directory gives an empty result; a request goes through at most 1000 of them, in the order of their identifiers, and page.next_token continues from where it stopped (page.total is not given).

        Paging: page.limit is the size of the page (at most 1000, the default), and the response carries page.next_token while
        there are more results; send it back as page.token with the same request. The results are sorted.

        This is the Authorization API 1.0 of OpenID AuthZEN, scoped to one service: the service is in the path, by its slug.
        resource.type is the name of a resource type of the service, and resource.id the resource id in the external system; the id
        "*" names the type as a whole, not a resource. action.name is an access level.

        The caller is a PEP client of the service. It authenticates with an API key, or with a token of an issuer registered for PEPs, and
        it speaks for the people of its application: the person of a question is the subject of the body, whose claims are in
        subject.properties (at most 100 claims and 16 KiB of JSON; preferred_username defaults to subject.id). The client needs the
        operation of the route (evaluate, search_resource, search_action or search_subject, and explain as well to ask for an explanation).
        Whatever it lacks, an unknown service included, the answer is the same 403. A client over its rate limit gets a 429 with Retry-After.

