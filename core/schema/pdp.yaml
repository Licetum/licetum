components:
  schemas:
    Anchor:
      additionalProperties: false
      properties:
        resource_id:
          description: The resource the rule is anchored on; null — the whole type
          type:
            - string
            - "null"
        type:
          description: Name of the resource type the rule is anchored on
          type: string
      required:
        - type
        - resource_id
      type: object
    AuthzenAction:
      additionalProperties: true
      properties:
        name:
          description: Access level
          examples:
            - write
          type: string
        properties:
          additionalProperties: {}
          description: Ignored
          type: object
      required:
        - name
      type: object
    AuthzenActionSearchRequest:
      additionalProperties: true
      properties:
        context:
          additionalProperties: {}
          description: The attributes of the request that the rules may read (conditions with source context)
          type: object
        page:
          $ref: "#/components/schemas/AuthzenPageRequest"
          description: Which page of the results is asked for
        resource:
          $ref: "#/components/schemas/AuthzenResource"
          description: The resource (resource.type is required; an empty resource.id, or *, is the type as a whole)
        subject:
          $ref: "#/components/schemas/AuthzenSubject"
          description: The person asked about (subject.type and subject.id are required)
      type: object
    AuthzenActionSearchResponse:
      additionalProperties: false
      properties:
        context:
          additionalProperties: {}
          description: Extra information
          type: object
        page:
          $ref: "#/components/schemas/AuthzenPageResponse"
          description: Paging of the results
        results:
          description: The access levels the subject has on the resource
          items:
            $ref: "#/components/schemas/AuthzenAction"
          type: array
      required:
        - results
      type: object
    AuthzenEvaluationRequest:
      additionalProperties: true
      properties:
        action:
          $ref: "#/components/schemas/AuthzenAction"
          description: The access level asked for (action.name is required)
        context:
          additionalProperties: {}
          description: "The attributes of the request that the rules may read (conditions with source context). context.licetum holds the settings of Licetum: {\"explain\": true} adds the explanation of the decision to the response context"
          type: object
        resource:
          $ref: "#/components/schemas/AuthzenResource"
          description: What is accessed (resource.type and resource.id are required; * is the type as a whole)
        subject:
          $ref: "#/components/schemas/AuthzenSubject"
          description: The person asked about (subject.type and subject.id are required)
      type: object
    AuthzenEvaluationResponse:
      additionalProperties: false
      properties:
        context:
          additionalProperties: {}
          description: "With explain: reason_admin holds the explanation. In a batch, error holds the status and the message of an evaluation that could not be decided (the decision is then false); a short-circuited batch names the semantic in reason"
          type: object
        decision:
          description: Whether the access is granted
          type: boolean
      required:
        - decision
      type: object
    AuthzenEvaluationsRequest:
      additionalProperties: true
      properties:
        action:
          $ref: "#/components/schemas/AuthzenAction"
          description: Default action
        context:
          additionalProperties: {}
          description: Default context
          type: object
        evaluations:
          description: "The evaluations, up to 100. Absent or empty: the top-level subject, resource, action and context are one evaluation, and the answer is a single decision"
          items:
            $ref: "#/components/schemas/AuthzenEvaluationRequest"
          maxItems: 100
          type:
            - array
            - "null"
        options:
          $ref: "#/components/schemas/AuthzenOptions"
          description: How the evaluations are executed
        resource:
          $ref: "#/components/schemas/AuthzenResource"
          description: Default resource
        subject:
          $ref: "#/components/schemas/AuthzenSubject"
          description: Default subject
      type: object
    AuthzenEvaluationsResponse:
      additionalProperties: false
      properties:
        context:
          additionalProperties: {}
          description: "With explain: reason_admin holds the explanation of the decision of a request without evaluations"
          type: object
        decision:
          description: The decision of a request without evaluations; absent when evaluations were given
          type: boolean
        evaluations:
          description: Decisions in the order asked (fewer when the semantic stopped the batch)
          items:
            $ref: "#/components/schemas/AuthzenEvaluationResponse"
          type:
            - array
            - "null"
      type: object
    AuthzenMetadata:
      additionalProperties: false
      properties:
        access_evaluation_endpoint:
          description: URL of the Access Evaluation API
          type: string
        access_evaluations_endpoint:
          description: URL of the Access Evaluations API
          type: string
        policy_decision_point:
          description: "The identifier of the Policy Decision Point: the base URL of the service, which is also where the default paths of the API are appended"
          examples:
            - https://licetum.example.com/service/orders
          type: string
        search_action_endpoint:
          description: URL of the Action Search API
          type: string
        search_resource_endpoint:
          description: URL of the Resource Search API
          type: string
        search_subject_endpoint:
          description: URL of the Subject Search API
          type: string
      required:
        - policy_decision_point
        - access_evaluation_endpoint
        - access_evaluations_endpoint
        - search_subject_endpoint
        - search_action_endpoint
        - search_resource_endpoint
      type: object
    AuthzenOptions:
      additionalProperties: true
      properties:
        evaluations_semantic:
          description: execute_all (the default) answers every evaluation; deny_on_first_deny stops after the first denial or error; permit_on_first_permit stops after the first permit. The evaluations after the one that stops the batch are not answered
          enum:
            - execute_all
            - deny_on_first_deny
            - permit_on_first_permit
          type: string
      type: object
    AuthzenPageRequest:
      additionalProperties: true
      properties:
        limit:
          description: At most this many results; absent or 0 — the most the service gives in one page (1000)
          format: int64
          minimum: 0
          type:
            - integer
            - "null"
        properties:
          additionalProperties: {}
          description: Ignored
          type: object
        token:
          description: The next_token of the previous page. The subject, resource, action, context and limit must be the same as in the request that gave it
          type: string
      type: object
    AuthzenPageResponse:
      additionalProperties: false
      properties:
        count:
          description: The number of results on this page
          format: int64
          type: integer
        next_token:
          description: Pass it as page.token to read the next page; empty on the last page
          type: string
        total:
          description: The number of results of the whole search at the time of the request; absent when the search does not know it (the subject search)
          format: int64
          type: integer
      required:
        - next_token
        - count
      type: object
    AuthzenResource:
      additionalProperties: true
      properties:
        id:
          description: Resource id in the external system. An evaluation requires it, and * names the type as a whole; the action search reads an empty id or * as the type as a whole; the resource search ignores it
          examples:
            - b1
          type: string
        properties:
          additionalProperties: {}
          description: Ignored in a request; the resource search returns the name of the resource here
          type: object
        type:
          description: Name of the resource type in the service
          examples:
            - branch
          type: string
      required:
        - type
      type: object
    AuthzenResourceSearchRequest:
      additionalProperties: true
      properties:
        action:
          $ref: "#/components/schemas/AuthzenAction"
          description: The access level (action.name is required)
        context:
          additionalProperties: {}
          description: The attributes of the request that the rules may read (conditions with source context)
          type: object
        page:
          $ref: "#/components/schemas/AuthzenPageRequest"
          description: Which page of the results is asked for
        resource:
          $ref: "#/components/schemas/AuthzenResource"
          description: The type of the resources searched for (resource.type is required; resource.id is ignored)
        subject:
          $ref: "#/components/schemas/AuthzenSubject"
          description: The person asked about (subject.type and subject.id are required)
      type: object
    AuthzenResourceSearchResponse:
      additionalProperties: false
      properties:
        context:
          additionalProperties: {}
          description: Extra information
          type: object
        page:
          $ref: "#/components/schemas/AuthzenPageResponse"
          description: Paging of the results
        results:
          description: The resources the subject may do the action on; properties.name is the name of the resource
          items:
            $ref: "#/components/schemas/AuthzenResource"
          type: array
      required:
        - results
      type: object
    AuthzenSubject:
      additionalProperties: true
      properties:
        id:
          description: "Subject id: 1 to 256 bytes, no control characters, and not a group (group:…). Required by evaluations and by the resource and action searches; ignored by the subject search, which returns it. It is the subject of the bearer token (preferred_username, or sub) unless the caller is a client application the service trusts"
          examples:
            - alice
          type: string
        properties:
          additionalProperties: {}
          description: "The claims of a person other than the holder of the token, given by a trusted client: at most 100 claims and 16 KiB of JSON. Ignored for the holder of the token, whose claims come from the token"
          type: object
        type:
          description: "Subject type (not interpreted): 1 to 64 bytes, and not group"
          examples:
            - user
          type: string
      required:
        - type
      type: object
    AuthzenSubjectSearchRequest:
      additionalProperties: true
      properties:
        action:
          $ref: "#/components/schemas/AuthzenAction"
          description: The access level (action.name is required)
        context:
          additionalProperties: {}
          description: The attributes of the request that the rules may read (conditions with source context)
          type: object
        page:
          $ref: "#/components/schemas/AuthzenPageRequest"
          description: Which page of the results is asked for
        resource:
          $ref: "#/components/schemas/AuthzenResource"
          description: The resource (resource.type is required; an empty resource.id, or *, is the type as a whole)
        subject:
          $ref: "#/components/schemas/AuthzenSubject"
          description: "The subject: only its type is used (subject.type is required; subject.id is ignored)"
      type: object
    AuthzenSubjectSearchResponse:
      additionalProperties: false
      properties:
        context:
          additionalProperties: {}
          description: Extra information; subjects_registry is disabled while the registry of known subjects is off
          type: object
        page:
          $ref: "#/components/schemas/AuthzenPageResponse"
          description: Paging of the results
        results:
          description: The subjects that may do the action on the resource
          items:
            $ref: "#/components/schemas/AuthzenSubject"
          type: array
      required:
        - results
      type: object
    CheckInput:
      additionalProperties: true
      properties:
        checks:
          description: Questions to answer, up to 100 per request
          items:
            $ref: "#/components/schemas/CheckRequest"
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
        context:
          additionalProperties: {}
          description: Attributes of this request that the rules may read (conditions with source context). Claims come from the token; these are what the request itself carries, such as the client address or the channel
          type:
            - object
            - "null"
        explain:
          description: "Return an explanation with every answer: which rules grant the level, which deny it, and which exceptions lift a denial"
          type: boolean
      required:
        - checks
      type: object
    CheckRequest:
      additionalProperties: false
      properties:
        action:
          description: Access level asked for
          examples:
            - write
          type: string
        resource_id:
          description: Resource id in the external system. Omit it to ask about the type as a whole — creating new resources, or a permission without resources (a not_sync type)
          examples:
            - b1
          type:
            - string
            - "null"
        type:
          description: Name of the resource type in this service
          examples:
            - branch
          type: string
      required:
        - type
        - action
      type: object
    CheckResponse:
      additionalProperties: false
      properties:
        results:
          description: One answer per question, in the order asked
          items:
            $ref: "#/components/schemas/CheckResult"
          type: array
      required:
        - results
      type: object
    CheckResult:
      additionalProperties: false
      properties:
        allowed:
          description: Whether the caller may do it
          type: boolean
        explanation:
          $ref: "#/components/schemas/Explanation"
          description: Present when explain was asked for
      required:
        - allowed
      type: object
    DelegatedCheckInput:
      additionalProperties: true
      properties:
        checks:
          description: Questions to answer, up to 100 per request
          items:
            $ref: "#/components/schemas/CheckRequest"
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
        claims:
          additionalProperties: {}
          description: "The claims the person's own token would carry: the ones the rules of the service read (see GET /service/{id}/policy/claims in the admin API). preferred_username defaults to the subject. The caller vouches for them"
          type:
            - object
            - "null"
        context:
          additionalProperties: {}
          description: Attributes of the request the rules may read (conditions with source context)
          type:
            - object
            - "null"
        explain:
          description: Return an explanation with every answer
          type: boolean
        subject:
          description: The person, as the rules name them (their preferred_username, or sub). It must not look like a group (group:…)
          examples:
            - alice
          maxLength: 256
          minLength: 1
          type: string
      required:
        - subject
        - checks
      type: object
    DelegatedPermissionInput:
      additionalProperties: true
      properties:
        access:
          description: Only the resources (and types) that have this access level
          type: string
        after:
          description: "The resource id after which the page starts: the next_after of the previous page"
          type: string
        claims:
          additionalProperties: {}
          description: The claims the person's own token would carry (see the check). preferred_username defaults to the subject
          type:
            - object
            - "null"
        context:
          additionalProperties: {}
          description: Attributes of the request the rules may read (conditions with source context)
          type:
            - object
            - "null"
        limit:
          description: "At most this many resources of the type; needs type. Absent: all of them"
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
        subject:
          description: The person, as the rules name them (their preferred_username, or sub). It must not look like a group (group:…)
          examples:
            - alice
          maxLength: 256
          minLength: 1
          type: string
        type:
          description: Only this resource type
          type: string
      required:
        - subject
      type: object
    DenialRef:
      additionalProperties: false
      properties:
        level:
          description: "The denied level that matched: the asked level, a level it includes, or the wildcard"
          type: string
        lifted_by:
          description: Exceptions below the denial that lift it; a denial with none stands
          items:
            $ref: "#/components/schemas/RuleRef"
          type: array
        missing_attribute:
          description: The denial applies because a condition reads an attribute the request does not carry, and the rule says to apply it then (on_missing_attribute = apply)
          type: boolean
        rule:
          $ref: "#/components/schemas/RuleRef"
          description: The denying rule
        unresolved_parent:
          description: The denial applies because the resource has a parent that is not in the cache, so the hierarchy above it is not fully known
          type: boolean
      required:
        - rule
        - level
        - lifted_by
        - unresolved_parent
        - missing_attribute
      type: object
    Error:
      additionalProperties: false
      properties:
        detail:
          description: Human-readable error description in the language negotiated via Accept-Language
          type: string
        extra:
          $ref: "#/components/schemas/Extra"
          description: Machine-readable details
      required:
        - detail
        - extra
      type: object
    Explanation:
      additionalProperties: false
      properties:
        decision:
          description: allowed; denied — a denial removes a granted level; no_access — no rule grants the level; resource_not_found and type_not_found — there is nothing to check
          enum:
            - allowed
            - denied
            - no_access
            - resource_not_found
            - type_not_found
          type: string
        denials:
          description: Denials that apply to the level, lifted or not
          items:
            $ref: "#/components/schemas/DenialRef"
          type: array
        granted_by:
          description: Rules that grant the level, including through the level hierarchy of the type
          items:
            $ref: "#/components/schemas/RuleRef"
          type: array
      required:
        - decision
        - granted_by
        - denials
      type: object
    Extra:
      additionalProperties: false
      properties:
        blocked_by:
          description: "For type=blocked_by: which entities prevent the deletion"
          examples:
            - - assignment_rule
          items:
            type: string
          type:
            - array
            - "null"
        code:
          description: Stable machine-readable error code, independent of the response language
          examples:
            - service_not_found
          type: string
        missing:
          description: "For type=missing: which fields or sources are unavailable"
          examples:
            - - url
          items:
            type: string
          type:
            - array
            - "null"
        operation:
          description: "For a batch: the index of the operation that failed; nothing of the batch was applied"
          examples:
            - 2
          format: int64
          type: integer
        type:
          description: Kind of error
          enum:
            - generic
            - missing
            - provider_unavailable
            - blocked_by
          type: string
      required:
        - type
      type: object
    NotSyncTypePermission:
      additionalProperties: false
      properties:
        access:
          description: Access levels of the subject on the type
          examples:
            - - read
              - write
          items:
            type: string
          type: array
        type:
          description: "Type mode: the type has no synchronizer (no resources), access is granted to the type as a whole"
          enum:
            - not_sync
          type: string
      required:
        - type
        - access
      type: object
    ResourceAccess:
      additionalProperties: false
      properties:
        access:
          description: Access levels
          examples:
            - - read
              - write
          items:
            type: string
          type:
            - array
            - "null"
        id:
          description: Resource id in the external system
          examples:
            - b1
          type: string
        name:
          description: Resource name
          examples:
            - Branch1
          type: string
      required:
        - id
        - name
        - access
      type: object
    RuleRef:
      additionalProperties: false
      properties:
        access:
          description: Access levels of the rule
          items:
            type: string
          type: array
        anchor:
          $ref: "#/components/schemas/Anchor"
          description: Where the rule is anchored; it covers this resource through the hierarchy
        applies_to:
          description: "Why the rule applies to the caller: the subject, a group, a role, a claims predicate, or everyone"
          examples:
            - group 4e2c…
          type: string
        effect:
          description: allow or deny
          enum:
            - allow
            - deny
          type: string
        exception:
          description: An allow rule that lifts the denials above it
          type: boolean
        rule_id:
          description: Id of the assignment rule
          format: uuid
          type: string
      required:
        - rule_id
        - effect
        - exception
        - access
        - anchor
        - applies_to
      type: object
    SyncTypePermission:
      additionalProperties: false
      properties:
        next_after:
          description: "Present when the answer is a page that is not the last: pass it as after to read the next page"
          type: string
        resources:
          description: Resources of the type available to the subject, with access levels
          items:
            $ref: "#/components/schemas/ResourceAccess"
          type: array
        type:
          description: "Type mode: the type has a synchronizer, access is granted per resource"
          enum:
            - sync
          type: string
      required:
        - type
        - resources
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: Access token issued by the IdP of the service whose permissions are being checked.
      scheme: bearer
      type: http
info:
  description: |
    **Licetum** is a centralized authorization service for all of your company's services.
    Access rights are stored in one place: instead of a separate role model in every application,
    rules are defined and checked centrally.

    ### Why

    - **Single point of control.** User permissions for every system are granted, revoked and checked in one place.
    - **Cross-service access.** Any entity of any service (a project, report, gallery, branch, etc.) can be
    shared, and the same users and groups can be granted access to it across all systems.
    - **Simpler maintenance.** Services don't implement authorization themselves; they ask Licetum:
    "may user X perform action Y on object Z?"
    - **Transparency and audit.** You can see who has which permissions and where they come from.

    ### Errors

    Every error is `{"detail": "text", "extra": {"type": "generic" | "missing" | "blocked_by", "code": "..."}}`.
    `detail` is localized according to the `Accept-Language` header (en, ru, zh); `extra.code` is a stable
    machine-readable code.
  license:
    identifier: MIT
    name: MIT
  title: Licetum PDP
  version: 0.1.0
openapi: 3.1.0
paths:
  /.well-known/authzen-configuration/service/{service_id}:
    get:
      description: The discovery document of the AuthZEN API of one service (OpenID AuthZEN 1.0, "Policy Decision Point Metadata"). The Policy Decision Point of a service is <PDP__PUBLIC_URL>/service/<slug>, so the document is served at the well-known path inserted between the host and that path. It needs no token. It is built from PDP__PUBLIC_URL, and is not served (404) without it.
      operationId: authzen_metadata
      parameters:
        - description: Service id or slug
          in: path
          name: service_id
          required: true
          schema:
            description: Service id or slug
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthzenMetadata"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
          headers:
            Licetum-Error-Code:
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                type: string
          description: Not Found
          headers:
            Licetum-Error-Code:
              schema:
                type: string
        "422":
          content:
            application/json:
              schema:
                type: string
          description: Unprocessable Entity
          headers:
            Licetum-Error-Code:
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
          headers:
            Licetum-Error-Code:
              schema:
                type: string
      summary: AuthZEN Policy Decision Point metadata
      tags:
        - AuthZEN
  /service/{service_id}/access/v1/evaluation:
    post:
      description: |-
        Decides whether the subject may perform the action on the resource.

        This is the Authorization API 1.0 of OpenID AuthZEN, scoped to one service: the service is in the path, as its id or its slug.
        resource.type is the name of a resource type of the service, and resource.id the resource id in the external system; the id
        "*" names the type as a whole, not a resource. action.name is an access level. subject.id is the subject of the bearer token
        (preferred_username, or sub) and the claims come from the token. A client application the service trusts (its azp, or
        client_id, is in the service's trusted_clients) may ask about any person: it gives the claims of the person in
        subject.properties, and every such call is recorded as the calls on behalf of a person are.

        The context holds the attributes of the request that the rules may read. Its key licetum holds the settings of Licetum, and
        is read from the top-level context only: min_revision (the answer reflects every write up to that revision) and explain (the
        explanation goes into context.reason_admin).

        A request that is not valid is a 400, a missing or invalid token a 401, a subject the caller may not ask about a 403. An error
        has its message as a JSON string, and its code in the Licetum-Error-Code header.
      operationId: authzen_evaluation
      parameters:
        - description: Service id or slug
          in: path
          name: service_id
          required: true
          schema:
            description: Service id or slug
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthzenEvaluationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthzenEvaluationResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
          headers:
            Licetum-Error-Code:
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
          headers:
            Licetum-Error-Code:
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
          headers:
            Licetum-Error-Code:
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                type: string
          description: Not Found
          headers:
            Licetum-Error-Code:
              schema:
                type: string
        "422":
          content:
            application/json:
              schema:
                type: string
          description: Unprocessable Entity
          headers:
            Licetum-Error-Code:
              schema:
                type: string
        "424":
          content:
            application/json:
              schema:
                type: string
          description: Failed Dependency
          headers:
            Licetum-Error-Code:
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
          headers:
            Licetum-Error-Code:
              schema:
                type: string
      security:
        - bearer: []
      summary: AuthZEN access evaluation
      tags:
        - AuthZEN
  /service/{service_id}/access/v1/evaluations:
    post:
      description: |-
