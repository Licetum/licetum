# DEC07: the validity windows of rules and of group memberships are compared with the time of the decision (the case's
# `at`, else the fixture's `now`). A window holds from valid_from, included, to expires_at, excluded; a rule or a membership
# outside its window does not exist for the decision, whatever it would grant or deny.
contracts: [DEC07]
description: Validity windows of rules, of a denial and an exception, of a role assignment and of (nested) group memberships, at their boundaries.
now: 2030-01-01T12:00:00Z
services: [org]
types:
  - {name: division, service: org, sync: true}
  - {name: rrs, service: org, sync: true, parents: [{type: division}]}
  - {name: branch, service: org, sync: true, parents: [{type: rrs}]}
resources:
  - {type: division, id: D1}
  - {type: division, id: D2}
  - {type: rrs, id: R1, parents: [{type: division, id: D1}]}
  - {type: rrs, id: R2, parents: [{type: division, id: D1}]}
  - {type: rrs, id: R3, parents: [{type: division, id: D2}]}
  - {type: branch, id: B1, parents: [{type: rrs, id: R1}]}
  - {type: branch, id: B2, parents: [{type: rrs, id: R1}]}
  - {type: branch, id: B3, parents: [{type: rrs, id: R2}]}
  - {type: branch, id: B4, parents: [{type: rrs, id: R3}]}
groups:
  # member-user is a contractor from 09:00 to 17:00; the contractors are auditors from 16:00 to 20:00.
  - name: contractors
    members:
      - {subject: member-user, valid_from: 2030-01-01T09:00:00Z, expires_at: 2030-01-01T17:00:00Z}
  - name: auditors
    members:
      - {group: contractors, valid_from: 2030-01-01T16:00:00Z, expires_at: 2030-01-01T20:00:00Z}
roles:
  - name: b2-reader
    items:
      - {type: branch, resource: B2, access: [read]}
rules:
  # The first step of TestIntegrationValidity: one rule that has expired and one that has not started yet.
  - {name: early-d1-expired, subject: early-user, type: division, resource: D1, access: [read], expires_at: 2030-01-01T11:00:00Z}
  - {name: early-d2-not-yet, subject: early-user, type: division, resource: D2, access: [read], valid_from: 2030-01-01T13:00:00Z}
  # Its second step: the same two rules and one whose window holds at noon.
  - {name: d1-expired, subject: user-1, type: division, resource: D1, access: [read], expires_at: 2030-01-01T11:00:00Z}
  - {name: d2-not-yet, subject: user-1, type: division, resource: D2, access: [read], valid_from: 2030-01-01T13:00:00Z}
  - {name: d1-window, subject: user-1, type: division, resource: D1, access: [read], valid_from: 2030-01-01T11:00:00Z, expires_at: 2030-01-01T13:00:00Z}
  # Rules on groups whose memberships have windows of their own.
  - {name: contractors-read-B3, member_of: contractors, type: branch, resource: B3, access: [read]}
  - {name: auditors-read-B4, member_of: auditors, type: branch, resource: B4, access: [read]}
  # A denial and an exception with windows, under a grant that always holds.
  - {name: always-read-D1, subject: deny-user, type: division, resource: D1, access: [read]}
  - {name: deny-R1-14-to-15, subject: deny-user, type: rrs, resource: R1, access: [read], deny: true, valid_from: 2030-01-01T14:00:00Z, expires_at: 2030-01-01T15:00:00Z}
  - {name: except-B1-1430-to-16, subject: deny-user, type: branch, resource: B1, access: [read], exception: true, valid_from: 2030-01-01T14:30:00Z, expires_at: 2030-01-01T16:00:00Z}
  # A role assignment carries its window to every item of the role.
  - {name: role-from-jan-2, subject: role-user, role: b2-reader, valid_from: 2030-01-02T00:00:00Z}
cases:
  # from admin-api/tests/integration/api/graph_test.go:TestIntegrationValidity
  - name: an expired rule and a rule that has not started grant nothing
    subject: early-user
    questions:
      - {type: division, resource: D1, action: read, allowed: false, decision: no_access}
      - {type: division, resource: D2, action: read, allowed: false, decision: no_access}
      - {type: rrs, resource: R1, action: read, allowed: false, decision: no_access}
  # from admin-api/tests/integration/api/graph_test.go:TestIntegrationValidity
  - name: a rule inside its window grants, the expired and the future ones still do not
    subject: user-1
    questions:
      - {type: division, resource: D1, action: read, allowed: true, decision: allowed, granted_by: [d1-window]}
      - {type: division, resource: D2, action: read, allowed: false, decision: no_access}
      - {type: rrs, resource: R1, action: read, allowed: true, granted_by: [d1-window]}
      - {type: rrs, resource: R3, action: read, allowed: false, decision: no_access}
  - name: one second before expires_at the rule is still in force
    subject: user-1
    at: 2030-01-01T10:59:59Z
    questions:
      - {type: division, resource: D1, action: read, allowed: true, decision: allowed, granted_by: [d1-expired]}
      - {type: division, resource: D2, action: read, allowed: false, decision: no_access}
  - name: expires_at is excluded and valid_from is included
    subject: user-1
    at: 2030-01-01T11:00:00Z
    questions:
      - {type: division, resource: D1, action: read, allowed: true, decision: allowed, granted_by: [d1-window]}
  - name: the last second of a window
    subject: user-1
    at: 2030-01-01T12:59:59Z
    questions:
      - {type: division, resource: D1, action: read, allowed: true, decision: allowed, granted_by: [d1-window]}
      - {type: division, resource: D2, action: read, allowed: false, decision: no_access}
  - name: at expires_at the window is over, at valid_from the next one begins
    subject: user-1
    at: 2030-01-01T13:00:00Z
    questions:
      - {type: division, resource: D1, action: read, allowed: false, decision: no_access}
      - {type: division, resource: D2, action: read, allowed: true, decision: allowed, granted_by: [d2-not-yet]}
      - {type: rrs, resource: R3, action: read, allowed: true, granted_by: [d2-not-yet]}
      - {type: rrs, resource: R1, action: read, allowed: false, decision: no_access}
  - name: before the membership starts the group grants nothing
    subject: member-user
    at: 2030-01-01T08:59:59Z
    questions:
      - {type: branch, resource: B3, action: read, allowed: false, decision: no_access}
      - {type: branch, resource: B4, action: read, allowed: false, decision: no_access}
  - name: the membership is in force from its valid_from
    subject: member-user
    at: 2030-01-01T09:00:00Z
    questions:
      - {type: branch, resource: B3, action: read, allowed: true, decision: allowed, granted_by: [contractors-read-B3]}
      - {type: branch, resource: B4, action: read, allowed: false, decision: no_access}
  - name: at noon the user is a contractor but the contractors are not auditors yet
    subject: member-user
    questions:
      - {type: branch, resource: B3, action: read, allowed: true, decision: allowed, granted_by: [contractors-read-B3]}
      - {type: branch, resource: B4, action: read, allowed: false, decision: no_access}
  - name: from 16:00 the nested membership is in force too
    subject: member-user
    at: 2030-01-01T16:00:00Z
    questions:
      - {type: branch, resource: B3, action: read, allowed: true, decision: allowed, granted_by: [contractors-read-B3]}
      - {type: branch, resource: B4, action: read, allowed: true, decision: allowed, granted_by: [auditors-read-B4]}
  - name: the last second of the membership
    subject: member-user
    at: 2030-01-01T16:59:59Z
    questions:
      - {type: branch, resource: B3, action: read, allowed: true, decision: allowed}
      - {type: branch, resource: B4, action: read, allowed: true, decision: allowed}
  - name: once the membership ends the nested group in force does not reach the user
    subject: member-user
    at: 2030-01-01T17:00:00Z
    questions:
      - {type: branch, resource: B3, action: read, allowed: false, decision: no_access}
      - {type: branch, resource: B4, action: read, allowed: false, decision: no_access}
  - name: an hour after the membership ended
    subject: member-user
    at: 2030-01-01T18:00:00Z
    questions:
      - {type: branch, resource: B3, action: read, allowed: false, decision: no_access}
      - {type: branch, resource: B4, action: read, allowed: false, decision: no_access}
  - name: before the denial starts the grant stands
    subject: deny-user
    questions:
      - {type: branch, resource: B1, action: read, allowed: true, decision: allowed, granted_by: [always-read-D1], denials: []}
      - {type: branch, resource: B2, action: read, allowed: true, decision: allowed}
      - {type: branch, resource: B3, action: read, allowed: true, decision: allowed}
  - name: the denial is in force from its valid_from, the exception not yet
    subject: deny-user
    at: 2030-01-01T14:00:00Z
    questions:
      - {type: branch, resource: B1, action: read, allowed: false, decision: denied, granted_by: [always-read-D1], denials: [{rule: deny-R1-14-to-15}]}
      - {type: branch, resource: B2, action: read, allowed: false, decision: denied, denials: [{rule: deny-R1-14-to-15}]}
      - {type: rrs, resource: R1, action: read, allowed: false, decision: denied}
      - {type: branch, resource: B3, action: read, allowed: true, decision: allowed, denials: []}
  - name: once the exception is in force it lifts the denial for B1 only
    subject: deny-user
    at: 2030-01-01T14:30:00Z
    questions:
      - {type: branch, resource: B1, action: read, allowed: true, decision: allowed, granted_by: [always-read-D1, except-B1-1430-to-16], denials: [{rule: deny-R1-14-to-15, lifted_by: [except-B1-1430-to-16]}]}
      - {type: branch, resource: B2, action: read, allowed: false, decision: denied, denials: [{rule: deny-R1-14-to-15}]}
  - name: at the expires_at of the denial nothing is denied, the exception still grants
    subject: deny-user
    at: 2030-01-01T15:00:00Z
    questions:
      - {type: branch, resource: B1, action: read, allowed: true, decision: allowed, granted_by: [always-read-D1, except-B1-1430-to-16], denials: []}
      - {type: branch, resource: B2, action: read, allowed: true, decision: allowed, denials: []}
  - name: after both windows only the grant is left
    subject: deny-user
    at: 2030-01-01T16:00:00Z
    questions:
      - {type: branch, resource: B1, action: read, allowed: true, decision: allowed, granted_by: [always-read-D1], denials: []}
  - name: a role assignment that has not started grants none of the items of the role
    subject: role-user
    questions:
      - {type: branch, resource: B2, action: read, allowed: false, decision: no_access}
  - name: from its valid_from the role assignment grants the items of the role
    subject: role-user
    at: 2030-01-02T00:00:00Z
    questions:
      - {type: branch, resource: B2, action: read, allowed: true, decision: allowed, granted_by: [role-from-jan-2]}
      - {type: branch, resource: B1, action: read, allowed: false, decision: no_access}
